  function addToCart(productId, sessionKey = 'primary') {
    const session = getTerminalSession(sessionKey);
    const product = getProductFast(productId);
    if (!session || !product || product.stock <= 0) return toast('Artículo sin stock.', 'error');
    if (product.saleType === "weight") return openManualWeightModal(productId, sessionKey);
    const item = session.cart.find(line => line.productId === productId && !line.byWeight);
    const currentQty = item?.qty || 0;
    if (currentQty >= product.stock) return toast('No hay más unidades disponibles.', 'error');
    if (item) item.qty += 1;
    else session.cart.push({ productId, qty: 1, byWeight: false });
    updateCartUI(sessionKey);
  }

  function changeCartQty(productId, delta, sessionKey = 'primary') {
    const session = getTerminalSession(sessionKey);
    const item = session?.cart.find(line => line.productId === productId);
    const product = getProductFast(productId);
    if (!item || !product) return;
    const next = item.qty + delta;
    if (next <= 0) session.cart = session.cart.filter(line => line.productId !== productId);
    else if (next <= product.stock) item.qty = next;
    else toast('La cantidad supera el stock disponible.', 'error');
    updateCartUI(sessionKey);
  }

  function updateCartUI(sessionKey = 'primary') {
    const session = getTerminalSession(sessionKey);
    const cartList = document.getElementById(salesInputId(sessionKey, 'cartList'));
    const totalOrb = document.getElementById(salesInputId(sessionKey, 'cartTotalOrb'));
    const totalMini = document.getElementById(salesInputId(sessionKey, 'cartTotalMini'));
    const itemCounter = document.getElementById(salesInputId(sessionKey, 'cartItemCounter'));
    if (!session || !cartList) return;
    const lines = session.cart.map(item => ({ ...item, product: getProductFast(item.productId) })).filter(item => item.product);
    if (!lines.length) {
      cartList.innerHTML = `
        <div class="terminal-empty-state">
          <div>
            <span class="icon">🛒</span>
            <strong>El carrito está vacío</strong>
            <div>Escaneá un producto para comenzar</div>
          </div>
        </div>`;
    } else {
      cartList.innerHTML = lines.map(item => `
        <div class="terminal-cart-row">
          <div class="terminal-product-cell">
            <strong>${escapeHtml(item.product.name)}</strong>
            <small>${item.byWeight ? `PLU ${escapeHtml(item.product.plu || "—")} · venta por peso` : (item.product.barcode ? `Código ${escapeHtml(item.product.barcode)}` : 'Sin código')}</small>
            ${item.byWeight && item.source === "scale" ? `<span class="weight-line-note">⚖ Leído desde etiqueta de balanza</span>` : ""}
          </div>
          <div>${money(item.product.price)}${item.byWeight ? `<small class="muted"> / kg</small>` : ""}</div>
          <div>${item.byWeight ? `<span class="weight-qty-display"><strong>${formatWeightKg(item.qty)}</strong><button type="button" data-action="remove-weight" data-id="${item.productId}" data-session="${sessionKey}" title="Quitar">×</button></span>` : `<div class="terminal-qty-box"><button type="button" data-action="minus" data-id="${item.productId}" data-session="${sessionKey}">−</button><strong>${item.qty}</strong><button type="button" data-action="plus" data-id="${item.productId}" data-session="${sessionKey}">+</button></div>`}</div>
          <div><strong>${money(item.byWeight && Number.isFinite(Number(item.subtotalOverride)) ? Number(item.subtotalOverride) : item.product.price * item.qty)}</strong></div>
        </div>`).join('');
    }
    const total = lines.reduce((sum, item) => sum + (item.byWeight && Number.isFinite(Number(item.subtotalOverride)) ? Number(item.subtotalOverride) : item.product.price * item.qty), 0);
    const unitCount = lines.filter(item => !item.byWeight).reduce((sum, item) => sum + Number(item.qty || 0), 0);
    const weightKg = lines.filter(item => item.byWeight).reduce((sum, item) => sum + Number(item.qty || 0), 0);
    if (totalOrb) totalOrb.textContent = money(total);
    if (totalMini) totalMini.textContent = money(total);
    if (itemCounter) {
      const parts = [];
      if (unitCount) parts.push(`${unitCount} unidad${unitCount === 1 ? "" : "es"}`);
      if (weightKg) parts.push(formatWeightKg(weightKg));
      itemCounter.textContent = parts.length ? parts.join(" · ") : "0 artículos";
    }
    cartList.querySelectorAll('button[data-action]').forEach(button => {
      button.addEventListener('click', () => {
        if (button.dataset.action === "remove-weight") {
          const session = getTerminalSession(button.dataset.session);
          if (session) session.cart = session.cart.filter(line => !(line.productId === button.dataset.id && line.byWeight));
          return updateCartUI(button.dataset.session);
        }
        changeCartQty(button.dataset.id, button.dataset.action === 'plus' ? 1 : -1, button.dataset.session);
      });
    });
  }

  async function completeSale(sessionKey = 'primary') {
    if (DEMO_MODE) {
      const session = getTerminalSession(sessionKey);
      if (!session?.cart?.length) return toast("Agregá al menos un producto para simular la venta.", "error");
      const total = session.cart.reduce((sum,line) => {
        const product = getProductFast(line.productId);
        return sum + (Number(line.subtotalOverride) || (Number(product?.price || 0) * Number(line.qty || 0)));
      },0);
      const modal = document.createElement("div");
      modal.className = "modal-backdrop";
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header"><h2>Venta simulada</h2><button type="button" class="icon-btn" id="closeDemoSale">✕</button></div>
          <div class="demo-safe-note">No se emitió factura, CAE, QR ni comprobante fiscal.</div>
          <p style="margin-top:16px">En la versión completa GestOK registraría la venta de <strong>${escapeHtml(currentUser()?.name || "Vendedor")}</strong>, actualizaría el stock, historial y estadísticas.</p>
          <div class="invoice-total" style="margin-top:14px"><span>Total de demostración</span><strong>${money(total)}</strong></div>
          <div class="actions"><button type="button" class="btn" id="finishDemoSale">Entendido</button></div>
        </div>`;
      document.body.appendChild(modal);
      const close = () => modal.remove();
      document.getElementById("closeDemoSale")?.addEventListener("click",close);
      document.getElementById("finishDemoSale")?.addEventListener("click",close);
      return;
    }
    const session = getTerminalSession(sessionKey);
    const seller = state.users.find(user => user.id === getSessionUserId(sessionKey));
    if (!session || !seller) return toast('No se pudo identificar el usuario de esta terminal.', 'error');
    if (!session.cart.length) return toast('La venta no tiene productos.', 'error');

    const items = session.cart.map(line => {
      const product = getProductFast(line.productId);
      return product ? { productId: product.id, name: product.name, barcode: product.barcode || '', plu: product.plu || '', saleType: line.byWeight ? 'weight' : (product.saleType || 'unit'), unitLabel: line.byWeight ? 'kg' : 'u', scaleCodes: line.scaleCodes || [], qty: line.qty, unitPrice: product.price, unitCost: Number(product.cost || 0), subtotal: line.byWeight && Number.isFinite(Number(line.subtotalOverride)) ? Number(line.subtotalOverride) : product.price * line.qty } : null;
    }).filter(Boolean);
    for (const item of items) {
      const product = getProductFast(item.productId);
      if (!product || product.stock < item.qty) return toast(`Stock insuficiente para ${item.name}.`, 'error');
    }

    const fiscal = state.settings.fiscal;
    const sale = {
      id: uid('sale'),
      number: `${state.settings.invoicePrefix}-${String(state.sales.length + 1).padStart(6, '0')}`,
      sellerId: seller.id,
      sellerName: seller.name,
      customerName: session.customerName.trim() || 'Consumidor final',
      customerDocType: session.customerDocType,
      customerDocNumber: session.customerDocNumber.trim(),
      customerTaxStatus: session.customerTaxStatus,
      paymentMethod: session.paymentMethod,
      items,
      total: items.reduce((sum, item) => sum + item.subtotal, 0),
      createdAt: new Date().toISOString(),
      fiscal: {
        requested: Boolean(fiscal.enabled),
        status: fiscal.enabled ? 'pending' : 'internal_only',
        environment: fiscal.environment,
        pointOfSale: fiscal.pointOfSale || '',
        voucherType: session.voucherType || 'Factura C',
        cae: '',
        caeExpiry: '',
        fiscalNumber: '',
        qrUrl: '',
        error: fiscal.enabled ? 'Pendiente de autorización mediante el servicio fiscal local.' : 'Facturación fiscal desactivada.'
      }
    };

    items.forEach(item => { getProductFast(item.productId).stock -= item.qty; });
    state.sales.push(sale);
    saveState();
    resetTerminalSession(sessionKey);
    invoiceSaleId = sale.id;
    updateCartUI(sessionKey);

    if (
      fiscal.enabled &&
      fiscal.bridgeStatus === 'ready' &&
      String(fiscal.cuit || '').replace(/\D/g, '').length === 11 &&
      Number(fiscal.pointOfSale) > 0 &&
      String(fiscal.certificateAlias || '').trim()
    ) {
      toast(`Venta de ${seller.name} guardada. Solicitando autorización fiscal local...`, 'success');
      await requestFiscalAuthorization(sale);
    } else if (fiscal.enabled) {
      toast(`Venta de ${seller.name} guardada como pendiente: revisá conexión/certificado/configuración ARCA.`, 'error');
    } else {
      toast(`Venta de ${seller.name} registrada.`, 'success');
    }
    render();
    openInvoiceModal(sale);
  }

  async function requestFiscalAuthorization(sale) {
  if (DEMO_MODE) {
    toast("Demostración: no se realizó ninguna conexión con ARCA ni se solicitó CAE.", "info");
    return false;
  }
  const fiscal = state.settings.fiscal || {};
  sale.fiscal = sale.fiscal || {};

  const setAuthorized = (data, recovered = false) => {
    sale.fiscal.status = "authorized";
    sale.fiscal.cae = String(data.cae || "");
    sale.fiscal.caeExpiry = String(data.caeExpiry || "");
    sale.fiscal.pointOfSale = String(data.pointOfSale || fiscal.pointOfSale || "");
    sale.fiscal.voucherNumber = Number(data.voucherNumber || 0);
    sale.fiscal.fiscalNumber = String(
      data.fiscalNumber ||
      `${String(data.pointOfSale || fiscal.pointOfSale || "").padStart(5,"0")}-${String(data.voucherNumber || "").padStart(8,"0")}`
    );
    sale.fiscal.voucherType = String(data.voucherLabel || "Factura C");
    sale.fiscal.qrUrl = String(data.qrUrl || "");
    sale.fiscal.qrDataUrl = String(data.qrDataUrl || "");
    sale.fiscal.qrRenderError = String(data.qrRenderError || "");
    sale.fiscal.arcaDate = String(data.date || "");
    sale.fiscal.error = "";
    sale.fiscal.recoveredFromArca = Boolean(recovered || data.recovered);
    sale.fiscal.observations = Array.isArray(data.observations) ? data.observations : [];
    sale.fiscal.events = Array.isArray(data.events) ? data.events : [];
    saveState();
  };

  // Si ya tenemos CAE guardado, JAMÁS volver a emitir.
  if (sale.fiscal.status === "authorized" && sale.fiscal.cae) {
    toast(`La venta ya tiene CAE ${sale.fiscal.cae}. No se reemitió.`, "info");
    return true;
  }

  const payload = {
    cuit: String(fiscal.cuit || "").replace(/\D/g, ""),
    pointOfSale: Number(fiscal.pointOfSale),
    amount: Number(sale.total || 0),
    certificateAlias: String(fiscal.certificateAlias || "").trim(),
    receiverTaxStatus: String(sale.customerTaxStatus || "consumidor_final"),
    docType: Number(sale.customerDocType || 99),
    docNumber: String(sale.customerDocNumber || "").replace(/\D/g, ""),
    confirmation: "EMITIR_FACTURA_REAL"
  };

  try {
    // Paso 1: consultar correlatividad antes de emitir.
    const lvResponse = await fetch(`${fiscal.bridgeUrl}/api/arca/last-voucher`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        cuit: fiscal.cuit,
        pointOfSale: Number(fiscal.pointOfSale),
        voucherType: 11,
        certificateAlias: fiscal.certificateAlias
      })
    });
    const lv = await lvResponse.json().catch(() => ({}));

    if (!lvResponse.ok || !lv.ok) {
      throw new Error(lv.message || "No se pudo consultar la correlatividad en ARCA.");
    }

    const nextVoucher = Number(lv.nextVoucherNumber || 0);
    if (!nextVoucher) throw new Error("ARCA no devolvió el próximo número de comprobante.");

    // Si esta venta guardó anteriormente un número esperado, recuperar antes de reintentar.
    const expected = Number(sale.fiscal.expectedVoucherNumber || 0);
    if (expected && expected <= Number(lv.lastVoucherNumber || 0)) {
      const recoverResponse = await fetch(`${fiscal.bridgeUrl}/api/arca/consult-voucher`, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({
          cuit: fiscal.cuit,
          pointOfSale: Number(fiscal.pointOfSale),
          voucherNumber: expected,
          certificateAlias: fiscal.certificateAlias
        })
      });
      const recovered = await recoverResponse.json().catch(() => ({}));
      if (recoverResponse.ok && recovered.ok && recovered.authorized && recovered.cae) {
        setAuthorized(recovered, true);
        toast(`Factura ${sale.fiscal.fiscalNumber} recuperada desde ARCA.`, "success");
        return true;
      }
    }

    // Guardar el número que estamos a punto de solicitar ANTES de llamar FECAESolicitar.
    sale.fiscal.expectedVoucherNumber = nextVoucher;
    sale.fiscal.status = "authorizing";
    sale.fiscal.error = "";
    saveState();

    const response = await fetch(`${fiscal.bridgeUrl}/api/arca/issue-invoice`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    });
    const data = await response.json().catch(() => ({}));

    if (data.authorized && data.cae && data.voucherNumber) {
      setAuthorized(data, false);
      toast(`Factura ${sale.fiscal.fiscalNumber} autorizada por ARCA.`, "success");
      return true;
    }

    // Respuesta dudosa: antes de marcar pendiente, consultar ARCA por el número reservado.
    const recoverResponse = await fetch(`${fiscal.bridgeUrl}/api/arca/consult-voucher`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        cuit: fiscal.cuit,
        pointOfSale: Number(fiscal.pointOfSale),
        voucherNumber: nextVoucher,
        certificateAlias: fiscal.certificateAlias
      })
    });
    const recovered = await recoverResponse.json().catch(() => ({}));

    if (recoverResponse.ok && recovered.ok && recovered.authorized && recovered.cae) {
      setAuthorized(recovered, true);
      toast(`Factura ${sale.fiscal.fiscalNumber} recuperada desde ARCA después de una respuesta incompleta.`, "success");
      return true;
    }

    sale.fiscal.status = "pending";
    sale.fiscal.error =
      data.message ||
      data.errors?.map(item => `${item.code}: ${item.message}`).join(" · ") ||
      "ARCA no confirmó un CAE.";
    sale.fiscal.observations = Array.isArray(data.observations) ? data.observations : [];
    sale.fiscal.events = Array.isArray(data.events) ? data.events : [];
    saveState();
    toast("La venta quedó pendiente. No se reintentará automáticamente sin consultar ARCA.", "error");
    return false;

  } catch (error) {
    // Corte de red / timeout: intentar recuperar el número reservado antes de permitir un reintento.
    const expected = Number(sale.fiscal.expectedVoucherNumber || 0);
    if (expected) {
      try {
        const recoverResponse = await fetch(`${fiscal.bridgeUrl}/api/arca/consult-voucher`, {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({
            cuit: fiscal.cuit,
            pointOfSale: Number(fiscal.pointOfSale),
            voucherNumber: expected,
            certificateAlias: fiscal.certificateAlias
          })
        });
        const recovered = await recoverResponse.json().catch(() => ({}));
        if (recoverResponse.ok && recovered.ok && recovered.authorized && recovered.cae) {
          setAuthorized(recovered, true);
          toast(`Factura ${sale.fiscal.fiscalNumber} recuperada desde ARCA.`, "success");
          return true;
        }
      } catch (_) {}
    }

    sale.fiscal.status = "pending";
    sale.fiscal.error = error?.message || "Error de comunicación fiscal.";
    saveState();
    toast("No se pudo confirmar la autorización. GestOK no reemitirá sin consultar ARCA.", "error");
    return false;
  }
}

  function xmlSafe(value) {

  }

  function crc32Bytes(bytes) {
    if (!crc32Bytes.table) {
      crc32Bytes.table = Array.from({length:256}, (_, n) => {
        let c=n;
        for (let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
        return c>>>0;
      });
    }
    let crc=0xFFFFFFFF;
    for (const byte of bytes) crc=crc32Bytes.table[(crc^byte)&0xFF]^(crc>>>8);
    return (crc^0xFFFFFFFF)>>>0;
  }

  function zipU16(n) { return new Uint8Array([n&255,(n>>>8)&255]); }
  function zipU32(n) { return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]); }
  function concatBytes(parts) {
    const length=parts.reduce((sum,p)=>sum+p.length,0);
    const out=new Uint8Array(length); let offset=0;
    parts.forEach(part=>{out.set(part,offset);offset+=part.length;});
    return out;
  }

  function buildZip(entries) {
    const enc=new TextEncoder();
    const locals=[]; const centrals=[]; let offset=0;
    const dt=new Date();
    const dosTime=((dt.getHours()&31)<<11)|((dt.getMinutes()&63)<<5)|((Math.floor(dt.getSeconds()/2))&31);
    const dosDate=(((dt.getFullYear()-1980)&127)<<9)|(((dt.getMonth()+1)&15)<<5)|(dt.getDate()&31);
    for (const entry of entries) {
      const name=enc.encode(entry.name); const data=typeof entry.data==="string"?enc.encode(entry.data):entry.data;
      const crc=crc32Bytes(data);
      const local=concatBytes([
        zipU32(0x04034b50),zipU16(20),zipU16(0x0800),zipU16(0),zipU16(dosTime),zipU16(dosDate),
        zipU32(crc),zipU32(data.length),zipU32(data.length),zipU16(name.length),zipU16(0),name,data
      ]);
      locals.push(local);
      const central=concatBytes([
        zipU32(0x02014b50),zipU16(20),zipU16(20),zipU16(0x0800),zipU16(0),zipU16(dosTime),zipU16(dosDate),
        zipU32(crc),zipU32(data.length),zipU32(data.length),zipU16(name.length),zipU16(0),zipU16(0),zipU16(0),zipU16(0),zipU32(0),zipU32(offset),name
      ]);
      centrals.push(central); offset+=local.length;
    }
    const centralBytes=concatBytes(centrals);
    const end=concatBytes([zipU32(0x06054b50),zipU16(0),zipU16(0),zipU16(entries.length),zipU16(entries.length),zipU32(centralBytes.length),zipU32(offset),zipU16(0)]);
    return concatBytes([...locals,centralBytes,end]);
  }

  }

    const types=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
    const bytes=buildZip([
      {name:"[Content_Types].xml",data:types},{name:"_rels/.rels",data:rootRels},{name:"xl/workbook.xml",data:workbook},{name:"xl/_rels/workbook.xml.rels",data:workbookRels},{name:"xl/worksheets/sheet1.xml",data:sheet},{name:"xl/styles.xml",data:styles}

  }

  async function unzipXlsx(buffer) {
    const bytes=new Uint8Array(buffer); const view=new DataView(buffer);
    let eocd=-1;
    for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}}
    if(eocd<0) throw new Error("ZIP inválido");
    const count=view.getUint16(eocd+10,true); let offset=view.getUint32(eocd+16,true);
    const files={}; const decoder=new TextDecoder("utf-8");
    for(let i=0;i<count;i++){
      if(view.getUint32(offset,true)!==0x02014b50) throw new Error("Directorio ZIP inválido");
      const method=view.getUint16(offset+10,true), compressedSize=view.getUint32(offset+20,true), nameLen=view.getUint16(offset+28,true), extraLen=view.getUint16(offset+30,true), commentLen=view.getUint16(offset+32,true), localOffset=view.getUint32(offset+42,true);
      const name=decoder.decode(bytes.slice(offset+46,offset+46+nameLen));
      const localNameLen=view.getUint16(localOffset+26,true), localExtraLen=view.getUint16(localOffset+28,true), dataStart=localOffset+30+localNameLen+localExtraLen;
      const compressed=bytes.slice(dataStart,dataStart+compressedSize);
      let data;
      if(method===0) data=compressed;
      else if(method===8 && typeof DecompressionStream!=="undefined") {
        const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        data=new Uint8Array(await new Response(stream).arrayBuffer());
      } else throw new Error("Compresión XLSX no compatible con este navegador");
      files[name]=data;
      offset+=46+nameLen+extraLen+commentLen;
    }
    return files;
  }

  function normalizeExcelHeader(value) {
    return String(value??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim().replace(/[_-]+/g," ").replace(/\s+/g," ");
  }

  function excelNumeric(value) {
    if(typeof value==="number") return value;
    let text=String(value??"").trim(); if(!text) return 0;
    text=text.replace(/\s/g,"").replace(/\$/g,"");
    if(text.includes(",") && text.includes(".")) text=text.lastIndexOf(",")>text.lastIndexOf(".")?text.replace(/\./g,"").replace(",","."):text.replace(/,/g,"");
    else if(text.includes(",")) text=text.replace(",",".");
    const n=Number(text); return Number.isFinite(n)?n:0;
  }

  async function parseProductsXlsx(file) {
    const files=await unzipXlsx(await file.arrayBuffer());
    const decoder=new TextDecoder("utf-8");
    const parser=new DOMParser();
    let sheetPath="xl/worksheets/sheet1.xml";
    if(files["xl/workbook.xml"] && files["xl/_rels/workbook.xml.rels"]) {
      const wb=parser.parseFromString(decoder.decode(files["xl/workbook.xml"]),"application/xml");
      const first=wb.getElementsByTagNameNS("*","sheet")[0];
      const rid=first?.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id") || first?.getAttribute("r:id");
      const rels=parser.parseFromString(decoder.decode(files["xl/_rels/workbook.xml.rels"]),"application/xml");
      const rel=[...rels.getElementsByTagNameNS("*","Relationship")].find(r=>r.getAttribute("Id")===rid);
      const target=rel?.getAttribute("Target");
      if(target) sheetPath=target.startsWith("/")?target.slice(1):(target.startsWith("xl/")?target:`xl/${target.replace(/^\.\//,"")}`);
    }
    const sheetBytes=files[sheetPath] || files["xl/worksheets/sheet1.xml"];
    if(!sheetBytes) throw new Error("No se encontró una hoja de cálculo");
    const shared=[];
    if(files["xl/sharedStrings.xml"]) {
      const sst=parser.parseFromString(decoder.decode(files["xl/sharedStrings.xml"]),"application/xml");
      [...sst.getElementsByTagNameNS("*","si")].forEach(si=>shared.push([...si.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join("")));
    }
    const doc=parser.parseFromString(decoder.decode(sheetBytes),"application/xml");
    const rows=[];
    [...doc.getElementsByTagNameNS("*","row")].forEach(row=>{
      const values=[];
      [...row.getElementsByTagNameNS("*","c")].forEach(c=>{
        const ref=c.getAttribute("r")||"A1"; const letters=(ref.match(/[A-Z]+/i)||["A"])[0].toUpperCase();
        let col=0; for(const ch of letters) col=col*26+(ch.charCodeAt(0)-64); col--;
        const type=c.getAttribute("t")||""; let value="";
        if(type==="inlineStr") value=[...c.getElementsByTagNameNS("*","t")].map(t=>t.textContent||"").join("");
        else { const v=c.getElementsByTagNameNS("*","v")[0]?.textContent??""; value=type==="s"?(shared[Number(v)]??""):(type==="b"?(v==="1"):v); }
        values[col]=value;
      }); rows.push(values);
    });
    if(rows.length<2) throw new Error("El Excel no contiene artículos");
    const headers=rows[0].map(normalizeExcelHeader);
    const aliases={
      id:["id gestok","id"],name:["nombre","articulo","producto","name"],category:["categoria","rubro"],saleType:["tipo de venta","venta por","modalidad"],plu:["plu","codigo plu"],barcode:["codigo de barras","codigo","barcode","sku"],price:["precio de venta","precio","venta"],cost:["costo de compra","costo","coste"],stock:["stock actual","stock","cantidad"],minStock:["stock minimo","minimo","stock de seguridad"],createdAt:["fecha de creacion","creado"],updatedAt:["ultima actualizacion","actualizado"]
    };
    const index={}; Object.entries(aliases).forEach(([key,list])=>{index[key]=headers.findIndex(h=>list.includes(h));});
    if(index.name<0) throw new Error("Falta la columna Nombre/Artículo");
    return rows.slice(1).map(row=>({
      id:index.id>=0?String(row[index.id]||"").trim():"",
      name:String(row[index.name]||"").trim(),
      category:index.category>=0?String(row[index.category]||"").trim():"",
      saleType:index.saleType>=0 && agentNormalize(row[index.saleType]).includes("peso") ? "weight" : "unit",
      plu:index.plu>=0?scaleDigitsOnly(row[index.plu]):"",
      barcode:index.barcode>=0?String(row[index.barcode]||"").trim():"",
      price:index.price>=0?excelNumeric(row[index.price]):0,
      cost:index.cost>=0?excelNumeric(row[index.cost]):0,
      stock:index.stock>=0?Math.max(0,excelNumeric(row[index.stock])):0,
      minStock:index.minStock>=0?Math.max(0,excelNumeric(row[index.minStock])):3,
      createdAt:index.createdAt>=0?String(row[index.createdAt]||"").trim():"",
      updatedAt:index.updatedAt>=0?String(row[index.updatedAt]||"").trim():""
    })).filter(row=>row.name);
  }

  function openProductsImportModal(rows, fileName, sourceLabel = "archivo", importNote = "") {
    if (!rows.length) return toast(`No encontré artículos válidos en el ${sourceLabel}.`, "error");

    const existingCodes = new Set(state.products.map(p => String(p.barcode || "").trim()).filter(Boolean));
    const existingPlus = new Set(state.products.filter(p => p.saleType === "weight").map(p => scaleDigitsOnly(p.plu)).filter(Boolean));
    const existingIds = new Set(state.products.map(p => String(p.id || "")).filter(Boolean));
    const updates = rows.filter(r =>
      (r.barcode && existingCodes.has(String(r.barcode).trim())) ||
      (r.plu && existingPlus.has(scaleDigitsOnly(r.plu))) ||
      (r.id && existingIds.has(String(r.id)))
    ).length;
    const news = rows.length - updates;

    const modal = document.createElement("div");
    modal.className = "modal-backdrop";
    modal.innerHTML = `<div class="modal" style="width:min(100%,860px)">
      <div class="modal-header"><h2>Importar artículos desde ${escapeHtml(sourceLabel)}</h2><button type="button" class="icon-btn" id="closeProductsImport">×</button></div>
      <p class="muted">Archivo: <strong>${escapeHtml(fileName)}</strong>. Revisá el resumen antes de aplicar los cambios.</p>
      <div class="import-summary-grid">
        <div class="import-summary-card"><small>Filas válidas</small><strong>${rows.length}</strong></div>
        <div class="import-summary-card"><small>Nuevos artículos</small><strong>${news}</strong></div>
        <div class="import-summary-card"><small>Coincidencias</small><strong>${updates}</strong></div>
      </div>
      <div class="field"><label>Modo de importación</label><select id="productsImportMode">
        <option value="merge">Actualizar coincidencias y agregar nuevos</option>
        <option value="onlynew">Agregar solamente artículos nuevos</option>
        <option value="replace">Reemplazar catálogo completo</option>
      </select></div>
      ${importNote ? `<div class="transfer-note" style="border-color:rgba(245,158,11,.28);background:rgba(245,158,11,.07)">${escapeHtml(importNote)}</div>` : ""}
      <div class="transfer-note">GestOK compara por código de barras, PLU e ID. En una actualización conserva la imagen que ya tenga el artículo. “Reemplazar catálogo” elimina el catálogo actual antes de importar.</div>
      <div class="import-preview-table"><table><thead><tr><th>Artículo</th><th>Código</th><th>Precio</th><th>Costo</th><th>Stock</th></tr></thead><tbody>
        ${rows.slice(0,8).map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${escapeHtml(r.barcode||"—")}</td><td>${money(r.price)}</td><td>${money(r.cost)}</td><td>${r.stock}</td></tr>`).join("")}
      </tbody></table></div>
      <div class="actions"><button type="button" class="btn secondary" id="cancelProductsImport">Cancelar</button><button type="button" class="btn" id="confirmProductsImport">Importar ${rows.length} artículos</button></div>
    </div>`;
    document.body.appendChild(modal);

    const close = () => modal.remove();
    document.getElementById("closeProductsImport").addEventListener("click", close);
    document.getElementById("cancelProductsImport").addEventListener("click", close);
    modal.addEventListener("click", e => { if (e.target === modal) close(); });

    document.getElementById("confirmProductsImport").addEventListener("click", () => {
      const mode = document.getElementById("productsImportMode").value;
      const now = new Date().toISOString();
      let added = 0, updated = 0, skipped = 0;

      if (mode === "replace") state.products = [];

      // Índices temporales para que importar miles de productos no haga búsquedas O(n²).
      const byBarcode = new Map();
      const byPlu = new Map();
      const byId = new Map();
      for (const p of state.products) {
        const barcode = String(p.barcode || "").trim();
        const plu = scaleDigitsOnly(p.plu);
        const id = String(p.id || "");
        if (barcode) byBarcode.set(barcode, p);
        if (p.saleType === "weight" && plu) byPlu.set(plu, p);
        if (id) byId.set(id, p);
      }

      for (const row of rows) {
        const barcode = String(row.barcode || "").trim();
        const plu = scaleDigitsOnly(row.plu);
        const rowId = String(row.id || "");
        const existing =
          (barcode ? byBarcode.get(barcode) : null) ||
          (plu ? byPlu.get(plu) : null) ||
          (rowId ? byId.get(rowId) : null);

        if (existing) {
          if (mode === "onlynew") {
            skipped++;
            continue;
          }
          const image = existing.image || "";
          Object.assign(existing, {
            name:row.name,
            category:row.category,
            saleType:row.saleType || "unit",
            plu:row.plu || "",
            barcode,
            price:Number(row.price || 0),
            cost:Number(row.cost || 0),
            stock:Number(row.stock || 0),
            minStock:Number(row.minStock ?? 3),
            image,
            updatedAt:now
          });
          updated++;
        } else {
          const id = rowId && !byId.has(rowId) ? rowId : uid("prd");
          const created = {
            id,
            name:row.name,
            category:row.category || "",
            saleType:row.saleType || "unit",
            plu:row.plu || "",
            barcode,
            price:Number(row.price || 0),
            cost:Number(row.cost || 0),
            stock:Number(row.stock || 0),
            minStock:Number(row.minStock ?? 3),
            image:"",
            createdAt:row.createdAt || now,
            updatedAt:now
          };
          state.products.push(created);
          if (barcode) byBarcode.set(barcode, created);
          if (created.saleType === "weight" && plu) byPlu.set(plu, created);
          byId.set(id, created);
          added++;
        }
      }

      invalidateProductIndexes();
      saveState();
      close();
      renderAppShell();
      setTimeout(checkLowStockAlerts, 0);
      toast(`Importación lista: ${added} nuevos, ${updated} actualizados${skipped ? `, ${skipped} omitidos` : ""}.`, "success");
    });
  }

  function getScaleBarcodeSettings() {
    if (!state.settings.scaleBarcode) state.settings.scaleBarcode = structuredClone(defaultState.settings.scaleBarcode);
    return state.settings.scaleBarcode;
  }

  function scaleDigitsOnly(value) {
    return String(value || "").replace(/\D/g, "");
  }

  function ean13CheckDigitValid(code) {
    const digits = scaleDigitsOnly(code);
    if (digits.length !== 13) return false;
    const sum = digits.slice(0, 12).split("").reduce((acc, digit, index) => acc + Number(digit) * (index % 2 === 0 ? 1 : 3), 0);
    return (10 - (sum % 10)) % 10 === Number(digits[12]);
  }

  function normalizedScalePlu(value, length) {
    const digits = scaleDigitsOnly(value);
    if (!digits) return "";
    return digits.padStart(length, "0").slice(-length);
  }

  function parseScaleBarcode(code, options = {}) {
    const settings = getScaleBarcodeSettings();
    const digits = scaleDigitsOnly(code);
    if (!settings.enabled) return null;
    if (settings.totalLength && digits.length !== Number(settings.totalLength)) return null;
    if (settings.prefix && !digits.startsWith(String(settings.prefix))) return null;
    if (settings.validateCheckDigit && digits.length === 13 && !ean13CheckDigitValid(digits)) {
      return { isScale: true, error: "El dígito verificador EAN-13 no coincide." };
    }
    const pluStart = Math.max(0, Number(settings.pluStart || 1) - 1);
    const valueStart = Math.max(0, Number(settings.valueStart || 1) - 1);
    const pluLength = Math.max(1, Number(settings.pluLength || 1));
    const valueLength = Math.max(1, Number(settings.valueLength || 1));
    const plu = digits.slice(pluStart, pluStart + pluLength);
    const valueDigits = digits.slice(valueStart, valueStart + valueLength);
    if (plu.length !== pluLength || valueDigits.length !== valueLength) return { isScale: true, error: "El código no coincide con las posiciones configuradas." };
    const product = state.products.find(item => item.saleType === "weight" && normalizedScalePlu(item.plu, pluLength) === plu);
    if (!product) return { isScale: true, plu, error: `No hay un producto por peso con PLU ${plu}.` };
    const rawValue = Number(valueDigits);
    const divisor = Math.pow(10, Math.max(0, Number(settings.decimals || 0)));
    const decodedValue = rawValue / divisor;
    let weightKg = 0;
    let encodedTotal = null;
    if (settings.valueType === "weight") {
      weightKg = decodedValue;
      encodedTotal = Number(product.price || 0) * weightKg;
    } else {
      encodedTotal = decodedValue;
      if (Number(product.price || 0) <= 0) return { isScale: true, plu, product, error: "El producto no tiene precio por kg para calcular el peso." };
      weightKg = encodedTotal / Number(product.price || 0);
    }
    if (!(weightKg > 0)) return { isScale: true, plu, product, error: "El código de balanza contiene un peso o importe inválido." };
    return { isScale: true, code: digits, plu, product, weightKg, encodedTotal, valueDigits, valueType: settings.valueType };
  }

  function formatWeightKg(value) {
    return `${Number(value || 0).toLocaleString("es-AR", { minimumFractionDigits: 3, maximumFractionDigits: 3 })} kg`;
  }

  }

  function addWeightedToCart(productId, weightKg, sessionKey = "primary", meta = {}) {
    const session = getTerminalSession(sessionKey);
    const product = getProductFast(productId);
    const weight = Number(weightKg || 0);
    if (!session || !product || product.saleType !== "weight") return toast("No se pudo identificar el producto por peso.", "error");
    if (!(weight > 0)) return toast("El peso leído no es válido.", "error");
    const currentWeight = session.cart.filter(line => line.productId === productId && line.byWeight).reduce((sum, line) => sum + Number(line.qty || 0), 0);
    if (currentWeight + weight > Number(product.stock || 0)) return toast(`Stock insuficiente para ${product.name}.`, "error");
    const existing = session.cart.find(line => line.productId === productId && line.byWeight);
    const subtotal = Number(meta.encodedTotal ?? (Number(product.price || 0) * weight));
    if (existing) {
      existing.qty += weight;
      existing.subtotalOverride = Number(existing.subtotalOverride || 0) + subtotal;
      if (meta.code) existing.scaleCodes = [...(existing.scaleCodes || []), meta.code];
    } else {
      session.cart.push({ productId, qty: weight, byWeight: true, subtotalOverride: subtotal, scaleCodes: meta.code ? [meta.code] : [], source: meta.manual ? "manual-weight" : "scale" });
    }
    updateCartUI(sessionKey);
    toast(`${product.name}: ${formatWeightKg(weight)} · ${money(subtotal)}`, "success");
  }

  function statsDateKey(value) {
    const d = new Date(value);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }

  function statsPeriodBounds(period, previous = false) {
    const now = new Date();
    const endToday = new Date(now);
    let start;
    let end = new Date(now);
    if (period === "today") {
      start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      if (previous) {
        end = new Date(start.getTime() - 1);
        start = new Date(end.getFullYear(), end.getMonth(), end.getDate());
      }
    } else if (period === "7d" || period === "30d") {
      const days = period === "7d" ? 7 : 30;
      const currentStart = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (days - 1));
      if (!previous) start = currentStart;
      else {
        end = new Date(currentStart.getTime() - 1);
        start = new Date(end.getFullYear(), end.getMonth(), end.getDate() - (days - 1));
      }
    } else if (period === "month") {
      if (!previous) start = new Date(now.getFullYear(), now.getMonth(), 1);
      else {
        start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        end = new Date(now.getFullYear(), now.getMonth(), 0, 23, 59, 59, 999);
      }
    } else {
      start = new Date(0);
      if (previous) return null;
    }
    return { start, end };
  }

  function statsSalesFor(period, previous = false) {
    const bounds = statsPeriodBounds(period, previous);
    if (!bounds) return [];
    return state.sales.filter(sale => {
      const d = new Date(sale.createdAt);
      return d >= bounds.start && d <= bounds.end;
    });
  }

  function saleItemCost(item) {
    if (Number.isFinite(Number(item.unitCost))) return Number(item.unitCost);
    const product = getProductFast(item.productId);
    return Number(product?.cost || 0);
  }

  function salesRevenue(sales) { return sales.reduce((sum,sale) => sum + Number(sale.total || 0), 0); }
  function salesUnits(sales) { return sales.flatMap(sale => sale.items || []).reduce((sum,item) => sum + Number(item.qty || 0), 0); }
  function salesCost(sales) { return sales.flatMap(sale => sale.items || []).reduce((sum,item) => sum + saleItemCost(item) * Number(item.qty || 0), 0); }
  function percentChange(current, previous) {
    if (!previous) return current ? 100 : 0;
    return ((current - previous) / previous) * 100;
  }
  function trendText(current, previous) {
    const pct = percentChange(current, previous);
    return { text: `${pct >= 0 ? "+" : ""}${pct.toFixed(1)}% vs. período anterior`, cls: pct > 0 ? "up" : pct < 0 ? "down" : "neutral" };
  }
  function statKpi(label, value, detail = "", cls = "neutral") {
    return `<div class="stat-kpi"><span>${label}</span><strong>${value}</strong><small class="${cls}">${detail}</small></div>`;
  }
  function statsEmpty(message = "Todavía no hay información suficiente.") {
    return `<div class="empty" style="height:100%;display:grid;place-items:center">${message}</div>`;
  }

  function buildProductStats(sales) {
    const map = {};
    sales.forEach(sale => (sale.items || []).forEach(item => {
      const product = getProductFast(item.productId);
      if (!map[item.productId]) map[item.productId] = {
        id: item.productId,
        name: item.name || product?.name || "Producto",
        category: product?.category || "Sin categoría",
        units: 0,
        revenue: 0,
        cost: 0,
        profit: 0
      };
      const row = map[item.productId];
      row.units += Number(item.qty || 0);
      row.revenue += Number(item.subtotal ?? (Number(item.unitPrice || 0) * Number(item.qty || 0)));
      row.cost += saleItemCost(item) * Number(item.qty || 0);
      row.profit = row.revenue - row.cost;
    }));
    return Object.values(map);
  }

  function renderStatistics(page) {
    const currentSales = statsSalesFor(statsPeriod, false);
    const previousSales = statsSalesFor(statsPeriod, true);
    const revenue = salesRevenue(currentSales);
    const previousRevenue = salesRevenue(previousSales);
    const totalCost = salesCost(currentSales);
    const grossProfit = revenue - totalCost;
    const marginPct = revenue > 0 ? grossProfit / revenue * 100 : 0;
    const units = salesUnits(currentSales);
    const avgTicket = currentSales.length ? revenue / currentSales.length : 0;
    const avgUnits = currentSales.length ? units / currentSales.length : 0;
    const revenueTrend = trendText(revenue, previousRevenue);
    const ticketTrend = trendText(avgTicket, previousSales.length ? salesRevenue(previousSales)/previousSales.length : 0);
    const productStats = buildProductStats(currentSales);
    const fixedCosts = Number(state.settings.analytics?.fixedMonthlyCosts || 0);
    const monthlyGoal = Number(state.settings.analytics?.monthlySalesGoal || 0);
    const breakEven = marginPct > 0 ? fixedCosts / (marginPct / 100) : 0;
    const thisMonthSales = statsSalesFor("month", false);
    const thisMonthRevenue = salesRevenue(thisMonthSales);
    const goalCoverage = monthlyGoal > 0 ? Math.min(100, thisMonthRevenue/monthlyGoal*100) : 0;

    page.innerHTML = `
      <div class="stats-workspace page-shell">
        <section class="panel stats-head">
          <div><h2>Centro de análisis</h2><p>Indicadores comerciales, rentabilidad, vendedores, cobros e inventario.</p></div>

            <select id="statsPeriod" class="stats-period">
              <option value="today" ${statsPeriod === "today" ? "selected" : ""}>Hoy</option>
              <option value="7d" ${statsPeriod === "7d" ? "selected" : ""}>Últimos 7 días</option>
              <option value="30d" ${statsPeriod === "30d" ? "selected" : ""}>Últimos 30 días</option>
              <option value="month" ${statsPeriod === "month" ? "selected" : ""}>Mes actual</option>
              <option value="all" ${statsPeriod === "all" ? "selected" : ""}>Todo el historial</option>

            <button type="button" class="btn ghost small" id="analyticsSettings">⚙ Objetivos y costos</button>

          ${[
            ["overview","Resumen"],["sales","Ventas"],["products","Productos"],["sellers","Vendedores"],["payments","Cobros"],["inventory","Inventario"]
          ].map(([id,label]) => `<button type="button" class="stats-tab ${statsActiveTab === id ? "active" : ""}" data-stats-tab="${id}">${label}</button>`).join("")}
        </nav>
        <div class="stats-stage" id="statsStage"></div>
      </div>`;

    const stage = document.getElementById("statsStage");
    const renderActive = () => {
      if (statsActiveTab === "overview") renderStatsOverview(stage, currentSales, previousSales, {revenue,totalCost,grossProfit,marginPct,units,avgTicket,avgUnits,revenueTrend,ticketTrend,breakEven,monthlyGoal,thisMonthRevenue,goalCoverage,productStats});
      if (statsActiveTab === "sales") renderStatsSales(stage, currentSales, previousSales);
      if (statsActiveTab === "products") renderStatsProducts(stage, currentSales);
      if (statsActiveTab === "sellers") renderStatsSellers(stage, currentSales);
      if (statsActiveTab === "payments") renderStatsPayments(stage, currentSales);
      if (statsActiveTab === "inventory") renderStatsInventory(stage);
    };
    renderActive();

    document.querySelectorAll("[data-stats-tab]").forEach(button => button.addEventListener("click", () => {
      statsActiveTab = button.dataset.statsTab;
      document.querySelectorAll("[data-stats-tab]").forEach(btn => btn.classList.toggle("active", btn.dataset.statsTab === statsActiveTab));
      renderActive();
    }));
    document.getElementById("statsPeriod").addEventListener("change", event => {
      statsPeriod = event.target.value;
      renderAppShell();
    });
    document.getElementById("analyticsSettings").addEventListener("click", openAnalyticsSettingsModal);
  }

  function renderStatsOverview(stage, currentSales, previousSales, data) {

      daily[statsDateKey(d)] = 0;

    const dayEntries = Object.entries(daily);
    const maxDay = Math.max(1,...dayEntries.map(([,v])=>v));
    const lowStock = state.products.filter(p => Number(p.stock || 0) <= Number(p.minStock ?? 3));
    const noCost = state.products.filter(p => Number(p.cost || 0) <= 0);

    stage.innerHTML = `

            ${statKpi("Facturación", money(data.revenue), data.revenueTrend.text, data.revenueTrend.cls)}
            ${statKpi("Ganancia bruta", money(data.grossProfit), data.totalCost ? `Costo vendido: ${money(data.totalCost)}` : "Cargá costos para precisión", data.totalCost ? "up" : "neutral")}
            ${statKpi("Margen bruto", `${data.marginPct.toFixed(1)}%`, data.totalCost ? "Sobre ventas del período" : "Sin costos cargados", data.marginPct > 0 ? "up" : "neutral")}

          </div>
          <section class="panel stats-panel">
            <div class="stats-panel-head"><h3>Facturación diaria · últimos 7 días</h3><small>${money(dayEntries.reduce((s,[,v])=>s+v,0))} acumulado</small></div>
            <div class="mini-bars">${dayEntries.map(([day,value]) => {
              const d = new Date(day+"T12:00:00");

            }).join("")}</div>
          </section>
        </div>
        <div class="stats-right-stack">

              <div class="calc-box"><span>Objetivo mensual</span><strong>${data.monthlyGoal ? `${data.goalCoverage.toFixed(1)}%` : "Sin objetivo"}</strong><small>${data.monthlyGoal ? `Faltan ${money(goalRemaining)}` : "Configurá una meta de facturación"}</small></div>
            </div>
          </section>

            <div class="stats-alerts">

              <div class="stats-alert"><span class="stats-alert-icon">$</span><div><strong>Productos sin costo</strong><small>No entran correctamente en margen y ganancia.</small></div><span class="stats-alert-value">${noCost.length}</span></div>
              <div class="stats-alert"><span class="stats-alert-icon">!</span><div><strong>Comprobantes pendientes</strong><small>Operaciones pendientes de autorización fiscal.</small></div><span class="stats-alert-value">${pendingFiscal}</span></div>
            </div>
          </section>
        </div>
      </div>`;
  }

  function renderStatsSales(stage, currentSales, previousSales) {
    const revenue = salesRevenue(currentSales);
    const prevRevenue = salesRevenue(previousSales);
    const units = salesUnits(currentSales);
    const avgTicket = currentSales.length ? revenue/currentSales.length : 0;
    const maxTicket = currentSales.length ? Math.max(...currentSales.map(s=>Number(s.total||0))) : 0;
    const dayMap = {};
    const hourMap = Array.from({length:24},()=>0);
    currentSales.forEach(sale => {
      const d = new Date(sale.createdAt);
      const key = statsDateKey(d);
      dayMap[key] = (dayMap[key] || 0) + Number(sale.total || 0);
      hourMap[d.getHours()] += Number(sale.total || 0);
    });
    const bestDay = Object.entries(dayMap).sort((a,b)=>b[1]-a[1])[0];
    const bestHourIndex = hourMap.indexOf(Math.max(...hourMap));
    const hourGroups = [
      ["00–05",hourMap.slice(0,6).reduce((a,b)=>a+b,0)],
      ["06–11",hourMap.slice(6,12).reduce((a,b)=>a+b,0)],
      ["12–17",hourMap.slice(12,18).reduce((a,b)=>a+b,0)],
      ["18–23",hourMap.slice(18,24).reduce((a,b)=>a+b,0)]
    ];
    const maxGroup = Math.max(1,...hourGroups.map(([,v])=>v));
    const trend = trendText(revenue,prevRevenue);
    stage.innerHTML = `<div class="stats-view active stats-two-col">
      <section class="panel stats-panel">
        <div class="stats-panel-head"><h3>Rendimiento de ventas</h3><small>Período seleccionado</small></div>
        <div class="stats-kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">
          ${statKpi("Facturación",money(revenue),trend.text,trend.cls)}
          ${statKpi("Ticket promedio",money(avgTicket),`${currentSales.length} operaciones`,"neutral")}
          ${statKpi("Ticket más alto",money(maxTicket),"Mayor operación del período","up")}
          ${statKpi("Unidades / venta",currentSales.length ? (units/currentSales.length).toFixed(2) : "0",`${units} unidades vendidas`,"neutral")}
          ${statKpi("Mejor día",bestDay ? new Date(bestDay[0]+"T12:00:00").toLocaleDateString("es-AR") : "Sin datos",bestDay ? money(bestDay[1]) : "—","up")}
          ${statKpi("Hora más fuerte",currentSales.length ? `${String(bestHourIndex).padStart(2,"0")}:00` : "Sin datos",currentSales.length ? "Mayor facturación horaria" : "—","neutral")}
        </div>
      </section>
      <section class="panel stats-panel">
        <div class="stats-panel-head"><h3>Ventas por franja horaria</h3><small>Detecta los momentos más fuertes</small></div>
        ${currentSales.length ? hourGroups.map(([label,value])=>`<div class="progress-row"><span class="progress-label">${label}</span><div class="progress-track"><div class="progress-fill" style="width:${value/maxGroup*100}%"></div></div><span class="progress-value">${money(value)}</span></div>`).join("") : statsEmpty()}
      </section>
    </div>`;
  }

  function renderStatsProducts(stage, currentSales) {
    const rows = buildProductStats(currentSales);
    const byRevenue = rows.slice().sort((a,b)=>b.revenue-a.revenue).slice(0,6);
    const byUnits = rows.slice().sort((a,b)=>b.units-a.units).slice(0,6);

    rows.forEach(row => {

      categoryMap[cat].revenue += row.revenue; categoryMap[cat].units += row.units; categoryMap[cat].profit += row.profit;
    });
    const categories = Object.entries(categoryMap).sort((a,b)=>b[1].revenue-a[1].revenue).slice(0,6);

  function renderStatsPayments(stage, currentSales) {

    const maxPay = Math.max(1,...payments.map(([,v])=>v.revenue));
    const fiscalMap = {authorized:0,pending:0,internal_only:0,other:0};
    currentSales.forEach(sale => { const s=sale.fiscal?.status; if (s in fiscalMap) fiscalMap[s]++; else fiscalMap.other++; });
    const customerMap = {};
    currentSales.forEach(sale => { const k=sale.customerTaxStatus || "sin_dato"; customerMap[k]=(customerMap[k]||0)+1; });

      </div>
    </div>`;
  }

  function renderStatsInventory(stage) {
    const totalUnits = state.products.reduce((s,p)=>s+Number(p.stock||0),0);
    const costValue = state.products.reduce((s,p)=>s+Number(p.stock||0)*Number(p.cost||0),0);
    const retailValue = state.products.reduce((s,p)=>s+Number(p.stock||0)*Number(p.price||0),0);
    const potentialProfit = retailValue-costValue;
    const low = state.products.filter(p=>Number(p.stock||0)<=Number(p.minStock??3)).sort((a,b)=>Number(a.stock||0)-Number(b.stock||0));
    const out = state.products.filter(p=>Number(p.stock||0)===0).length;
    const last30 = statsSalesFor("30d",false);
    const units30 = salesUnits(last30);
    const dailyVelocity = units30/30;
    const coverageDays = dailyVelocity>0 ? totalUnits/dailyVelocity : 0;
    const noMovementIds = new Set(buildProductStats(last30).map(r=>r.id));
    const noMovement = state.products.filter(p=>Number(p.stock||0)>0 && !noMovementIds.has(p.id));
    stage.innerHTML = `<div class="stats-view active stats-two-col">
      <section class="panel stats-panel"><div class="stats-panel-head"><h3>Valor y salud del inventario</h3><small>Cálculos con stock actual</small></div><div class="stats-kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))">${statKpi("Unidades en stock",totalUnits,`${state.products.length} artículos`,"neutral")}${statKpi("Valor a costo",money(costValue),"Capital inmovilizado estimado","neutral")}${statKpi("Valor a venta",money(retailValue),"Facturación potencial del stock","up")}${statKpi("Ganancia potencial",money(potentialProfit),costValue ? "Venta total menos costo" : "Cargá costos para precisión",potentialProfit>0?"up":"neutral")}${statKpi("Cobertura estimada",coverageDays ? `${coverageDays.toFixed(1)} días` : "Sin cálculo",`${units30} unidades vendidas en 30 días`,"neutral")}${statKpi("Sin movimiento 30d",noMovement.length,`${out} agotados actualmente`,noMovement.length?"down":"up")}</div></section>
      <section class="panel stats-panel"><div class="stats-panel-head"><h3>Reposición prioritaria</h3><small>Stock ≤ mínimo configurado</small></div>${low.length ? `<table class="stats-table"><thead><tr><th>Producto</th><th class="right">Stock</th><th class="right">Mín.</th><th class="right">Faltante</th></tr></thead><tbody>${low.slice(0,8).map(p=>`<tr><td>${escapeHtml(p.name)}</td><td class="right">${Number(p.stock||0)}</td><td class="right">${Number(p.minStock??3)}</td><td class="right">${Math.max(0,Number(p.minStock??3)-Number(p.stock||0))}</td></tr>`).join("")}</tbody></table>` : statsEmpty("No hay productos por debajo del stock mínimo.")}</section>
    </div>`;
  }

  function fiscalConfigurationComplete() {

  async function checkFiscalBridge() {
    if (DEMO_MODE) {
      toast("Demo segura: la conexión fiscal está desactivada.", "info");
      return false;
    }
    const f = state.settings.fiscal;
    const statusEl = document.getElementById("fiscalBridgeStatus");
    if (statusEl) statusEl.innerHTML = `<span class="fiscal-status pending">● Probando servicio local...</span>`;
    try {
      const healthUrl = `${f.bridgeUrl.replace(/\/$/, "")}/api/health?alias=${encodeURIComponent(f.certificateAlias || "")}&cuit=${encodeURIComponent(String(f.cuit || "").replace(/\D/g, ""))}`;
      const response = await fetch(healthUrl, { method: "GET" });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) throw new Error(data.message || "Bridge no disponible");
      f.bridgeStatus = "ready";
      f.lastBridgeCheck = new Date().toISOString();
      saveState();
      if (statusEl) statusEl.innerHTML = `<span class="fiscal-status ready">● Bridge local activo</span><p class="muted">${escapeHtml(data.message || "Servicio local disponible.")}</p>`;
      toast("Servicio fiscal local detectado.", "success");
    } catch (error) {
      f.bridgeStatus = "offline";
      f.lastBridgeCheck = new Date().toISOString();
      saveState();
      if (statusEl) statusEl.innerHTML = `<span class="fiscal-status offline">● Bridge local desconectado</span><p class="muted">Iniciá el servicio local GestOK Fiscal Bridge para continuar.</p>`;
      toast("No se pudo conectar con el bridge fiscal local.", "error");
    }
  }

  function backupSafeName(value) {
    return String(value || "Negocio").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9_-]+/g, "_").replace(/^_+|_+$/g, "").slice(0,60) || "Negocio";
  }

  function buildGeneralBackup() {
    const now = new Date();
    const businessName = state.business?.name || licensePayload?.customer || "Negocio";
    const dateKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}-${String(now.getDate()).padStart(2,"0")}`;
    const timeKey = `${String(now.getHours()).padStart(2,"0")}-${String(now.getMinutes()).padStart(2,"0")}`;
    const folderName = `${backupSafeName(businessName)}/${dateKey}`;
    const fileName = `GestOK_${backupSafeName(businessName)}_${dateKey}_${timeKey}.gestokbackup`;
    return {
      type:"GestOKBackup",
      version:1,
      generatedAt:now.toISOString(),
      business:{ name:businessName },
      installationId:getInstallationId(),
      permanentLicenseCustomer:licensePayload?.customer || "",
      folderName,
      fileName,
      sections:{
        statistics:{ analytics:structuredClone(state.settings.analytics || {}) },
        history:structuredClone(state.sales || []),
        arca:structuredClone(state.settings.fiscal || {}),
        articles:structuredClone(state.products || [])
      }
    };
  }

  function downloadGeneralBackup() {
    const backup = buildGeneralBackup();
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:"application/json;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = backup.fileName;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast("Respaldo general exportado.", "success");
  }


  function applyImportedBackup(backup) {
    if (backup?.type !== "GestOKBackup" || !backup.sections) throw new Error("El archivo no contiene un respaldo GestOK válido.");
    state.products = structuredClone(Array.isArray(backup.sections.articles) ? backup.sections.articles : []);
    state.sales = structuredClone(Array.isArray(backup.sections.history) ? backup.sections.history : []);
    state.settings.analytics = structuredClone(backup.sections.statistics?.analytics || {});
    state.settings.fiscal = structuredClone(backup.sections.arca || state.settings.fiscal || {});

              <div class="subscription-step ${monthlyState.code === "pending" ? "current" : ""}"><strong>Pago pendiente</strong>10 días de gracia con respaldo habilitado.</div>
              <div class="subscription-step ${["paused_late","paused_manual"].includes(monthlyState.code) ? "current" : ""}"><strong>Pausada</strong>Solo se pausa GestOK Storage; GestOK local continúa.</div>
            </div>
            <div class="license-contact-guide"><strong>Cómo solicitarla:</strong> copiá tu ID, tocá <strong>WhatsApp suscripción</strong> y pegalo al final del mensaje después de “Mi ID es:”. Te responderemos con la licencia mensual para activarla acá.</div>
            <div class="field" style="margin-top:12px"><label>Licencia mensual nueva / renovación</label><textarea class="license-input" id="monthlyRenewToken" style="min-height:84px" placeholder="Pegá acá la licencia mensual recibida..."></textarea></div>
            <input type="file" id="monthlyRenewFile" accept=".gestok,.txt" class="hidden" />
            <div class="cloud-backup-actions">
              <button class="btn secondary" id="copyRenewalId" type="button">${monthlyLicensePayload ? "Copiar ID para renovar" : "Copiar ID para suscribirme"}</button>
              <button class="btn whatsapp-contact" id="whatsappMonthlyHub" type="button">💬 WhatsApp suscripción</button>
              <button class="btn secondary" id="importMonthlyRenew" type="button">Importar licencia</button>
              <button class="btn" id="activateMonthlyRenew" type="button">Activar mensual</button>
            </div>
            <div class="license-status-box" id="monthlyRenewStatus"></div>
          </section>

          <section class="panel license-hub-card" style="grid-column:1 / -1">
            <div class="panel-header"><div><h3>Guardar todos los datos</h3><p>Genera un respaldo completo y, con suscripción activa, te guía para enviarlo por WhatsApp a GestOK Storage.</p></div><span class="cloud-license-badge ${storageActive ? "active" : (monthlyLicensePayload ? "expired" : "none")}">${storageActive ? "💾 Respaldo habilitado" : "💾 Suscripción requerida"}</span></div>
            <div class="cloud-backup-actions backup-actions-prominent">
              <button class="btn backup-primary-action" id="saveStorageBackup" type="button">💾 Guardar todos los datos</button>
              <div class="backup-format-grid">
                <button class="btn secondary backup-format-btn" id="exportBackupPdf" type="button">⇩ Exportar en PDF</button>
                <button class="btn secondary backup-format-btn" id="exportBackupExcel" type="button">⇩ Exportar en Excel</button>
                <button class="btn secondary backup-format-btn" id="importBackupPdfExcel" type="button">⇧ Importar PDF / Excel</button>
              </div>
              <div class="backup-format-note">Exportar crea una copia local. Guardar usa GestOK Storage. Importar acepta PDF o Excel generados por GestOK.</div>
              <button class="btn secondary" id="exportGeneralBackup" type="button">Exportar respaldo local</button>
              <button class="btn secondary" id="importGeneralBackup" type="button">Importar respaldo</button>
            </div>
            <details class="license-fold" open>
              <summary>Qué información se incluye en el respaldo</summary>
              <div class="license-fold-body">
                <div class="cloud-data-list">
                  <div class="cloud-data-pill">📊 Estadísticas y configuración de objetivos</div>
                  <div class="cloud-data-pill">📜 Historial completo de ventas</div>
                  <div class="cloud-data-pill">🧾 Información y configuración ARCA</div>
                  <div class="cloud-data-pill">📦 Artículos, precios, stock, PLU e imágenes</div>
                </div>
              </div>
            </details>
            <details class="license-fold" open>
              <summary>Estado del servicio de respaldo</summary>
              <div class="license-fold-body">
                <div class="storage-service-state"><span>Estado de suscripción</span><strong>${escapeHtml(subscriptionState)}</strong></div>
                <div class="storage-service-state"><span>Método de entrega</span><strong>WhatsApp + archivo .gestokbackup</strong></div>
                <div class="storage-access-note"><strong>Regla de la suscripción:</strong> si el pago queda pendiente, GestOK mantiene el respaldo durante 10 días de gracia. Después, GestOK Storage se pausa y la reactivación puede incluir un recargo del 10%. Las ventas, artículos, historial y demás funciones locales nunca se bloquean por esta suscripción.</div>
                <div class="cloud-backup-status">${state.settings.cloud.lastBackupAt ? `Último respaldo preparado: ${formatDate(state.settings.cloud.lastBackupAt)} · ${escapeHtml(state.settings.cloud.lastBackupName || "")}` : "Todavía no se preparó ningún respaldo administrado desde esta instalación."}</div>
              </div>
            </details>
            <div class="license-scroll-hint"><span>↕</span> Deslizá con la rueda del mouse o con dos dedos en el touchpad para recorrer toda esta sección.</div>
            <input type="file" id="generalBackupFile" accept=".gestokbackup,.json" class="hidden" />
          </section>
        </div>
      </div>`;

    document.getElementById("copyLicenseHubId")?.addEventListener("click", copyInstallationId);
    document.getElementById("whatsappPermanentHub")?.addEventListener("click", () => openGestokWhatsApp("permanent"));
    document.getElementById("copyRenewalId")?.addEventListener("click", copyInstallationId);
    document.getElementById("whatsappMonthlyHub")?.addEventListener("click", () => openGestokWhatsApp("monthly"));
    const renewInput = document.getElementById("monthlyRenewToken");
    const renewStatus = document.getElementById("monthlyRenewStatus");
    const showRenewStatus = (message,type) => { renewStatus.className = `license-status-box show ${type}`; renewStatus.textContent = message; };
    document.getElementById("importMonthlyRenew")?.addEventListener("click", () => document.getElementById("monthlyRenewFile").click());
    document.getElementById("monthlyRenewFile")?.addEventListener("change", async event => {
      const file = event.target.files?.[0]; if (!file) return; renewInput.value = (await file.text()).trim(); showRenewStatus("Archivo mensual cargado.","success");
    });
    document.getElementById("activateMonthlyRenew")?.addEventListener("click", async () => {
      const result = await verifyMonthlyLicenseToken(renewInput.value);
      if (!result.ok) return showRenewStatus(result.reason,"error");
      localStorage.setItem(MONTHLY_LICENSE_KEY,result.token);
      monthlyLicensePayload=result.payload; monthlyLicenseVerified=true; dismissedMonthlyLicenseAlertKey="";
      showRenewStatus(`✓ Suscripción activa hasta ${monthlyDueDateLabel(result.payload)}.`,"success");
      setTimeout(()=>renderAppShell(),450);
    });
    document.getElementById("saveStorageBackup")?.addEventListener("click", prepareManagedBackupForWhatsApp);
    document.getElementById("exportBackupPdf")?.addEventListener("click", () => saveBackupByFormat("pdf", false));
    document.getElementById("exportBackupExcel")?.addEventListener("click", () => saveBackupByFormat("xlsx", false));
    document.getElementById("importBackupPdfExcel")?.addEventListener("click", importGeneralBackup);
    document.getElementById("exportGeneralBackup")?.addEventListener("click", downloadGeneralBackup);
    document.getElementById("importGeneralBackup")?.addEventListener("click", () => document.getElementById("generalBackupFile").click());
    document.getElementById("generalBackupFile")?.addEventListener("change", async event => {
      const file = event.target.files?.[0]; if (!file) return;
      try { await importGeneralBackupFile(file); } catch (error) { toast(error.message || "No se pudo importar el respaldo.","error"); }
      event.target.value="";
    });

  }

  function renderHistory(page) {
    const sales = getVisibleSales().slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    let currentPage=1, filtered=sales;
    page.innerHTML=`
      <div class="page-shell panel-body-scroll">
      <section class="panel panel-fill" style="margin-top:0">
        <div class="panel-header">
          <div><h2>${isAdmin()?"Todas las ventas":"Mis ventas"}</h2><p class="muted">Historial paginado para trabajar con grandes volúmenes.</p><span class="perf-badge">⚡ ${PERF_PAGE_SIZE} ventas por página</span></div>
          <input id="historySearch" placeholder="Buscar por número, cliente o vendedor..." />
        </div>
        <div class="panel-body-scroll"><div id="historyTable"></div><div id="historyPager" class="perf-pager"></div></div>
      </section></div>`;

    const draw=()=>{
      const pages=Math.max(1,Math.ceil(filtered.length/PERF_PAGE_SIZE));
      currentPage=Math.min(Math.max(1,currentPage),pages);
      const start=(currentPage-1)*PERF_PAGE_SIZE;
      const rows=filtered.slice(start,start+PERF_PAGE_SIZE);
      document.getElementById("historyTable").innerHTML=salesTable(rows,true);
      document.getElementById("historyPager").innerHTML=`
        <button type="button" class="btn secondary small" id="histPrev" ${currentPage<=1?"disabled":""}>← Anterior</button>
        <span class="page-info">Página ${currentPage} de ${pages} · ${filtered.length} ventas</span>
        <button type="button" class="btn secondary small" id="histNext" ${currentPage>=pages?"disabled":""}>Siguiente →</button>`;
      document.getElementById("histPrev")?.addEventListener("click",()=>{currentPage--;draw()});
      document.getElementById("histNext")?.addEventListener("click",()=>{currentPage++;draw()});
      bindSaleActions();
    };
    const search=()=>{
      const term=document.getElementById("historySearch").value.trim().toLowerCase();
      currentPage=1;
      filtered=!term?sales:sales.filter(sale=>[sale.number,sale.fiscal?.fiscalNumber,sale.customerName,sale.sellerName,sale.paymentMethod].some(v=>String(v||"").toLowerCase().includes(term)));
      draw();
    };
    document.getElementById("historySearch").addEventListener("input",debouncePerf(search,120));
    draw();
  }

  function fiscalStatusBadge(sale) {
    const status = sale.fiscal?.status || "legacy";
    if (status === "authorized") return `<span class="fiscal-status ready">Autorizada</span>`;
    if (status === "pending") return `<span class="fiscal-status pending">Pendiente ARCA</span>`;
    if (status === "internal_only") return `<span class="fiscal-status offline">Interna</span>`;
    return `<span class="fiscal-status demo">Anterior</span>`;
  }

  function salesTable(sales, actions = false) {
    if (!sales.length) return `<div class="empty">Todavía no hay ventas registradas.</div>`;
    return `<div class="table-wrap"><table><thead><tr><th>Comprobante</th><th>Fecha</th><th>Vendedor</th><th>Cliente</th><th>Fiscal</th><th>Cobro</th><th>Total</th>${actions ? "<th>Acción</th>" : ""}</tr></thead><tbody>
      ${sales.map(sale => `<tr><td><strong>${escapeHtml(sale.fiscal?.fiscalNumber || sale.number)}</strong></td><td>${formatDate(sale.createdAt)}</td><td>${escapeHtml(sale.sellerName)}</td><td>${escapeHtml(sale.customerName)}</td><td>${fiscalStatusBadge(sale)}</td><td>${escapeHtml(sale.paymentMethod)}</td><td><strong>${money(sale.total)}</strong></td>${actions ? `<td><button type="button" class="btn secondary small view-sale" data-id="${sale.id}">Ver comprobante</button></td>` : ""}</tr>`).join("")}
    </tbody></table></div>`;
  }

  function bindSaleActions() {
    document.querySelectorAll(".view-sale").forEach(button => button.addEventListener("click", () => {
      const sale = state.sales.find(item => item.id === button.dataset.id);
      if (sale) openInvoiceModal(sale);
    }));
  }

  function formatArcaCompactDate(value) {
    const raw = String(value || "").replace(/\D/g, "");
    if (raw.length !== 8) return value || "";
    return `${raw.slice(6,8)}/${raw.slice(4,6)}/${raw.slice(0,4)}`;
  }

  function taxStatusLabel(value) {
    const map = {
      consumidor_final: "Consumidor Final",
      responsable_inscripto: "IVA Responsable Inscripto",
      monotributo: "Responsable Monotributo",
      exento: "IVA Sujeto Exento",
      otro: "Otra condición"
    };
    return map[value] || value || "Consumidor Final";
  }

  function openInvoiceModal(sale) {
    invoiceSaleId = sale.id;
    const fiscal = sale.fiscal || { status: "legacy" };
    const cfg = state.settings.fiscal;
    const authorized = fiscal.status === "authorized" && fiscal.cae;
    const pending = fiscal.status === "pending";
    const businessName = String(state.business?.name || "GestOK").trim() || "GestOK";
    const ownerName = String(cfg.legalName || "").trim();
    const pointOfSale = fiscal.pointOfSale || cfg.pointOfSale || "";
    const fiscalNumber = authorized ? (fiscal.fiscalNumber || `${String(pointOfSale).padStart(5,"0")}-${String(fiscal.voucherNumber || "").padStart(8,"0")}`) : sale.number;
    const qrImage = fiscal.qrDataUrl
      ? `<img class="invoice-qr" src="${escapeHtml(fiscal.qrDataUrl)}" alt="QR ARCA">`
      : "";

    const modal = document.createElement("div");
    modal.className = "modal-backdrop";
    modal.innerHTML = `
      <div class="modal" style="width:min(100%,820px)">
        <div class="modal-header no-print">
          <h2>${authorized ? "Factura autorizada" : "Comprobante de venta"} ${escapeHtml(fiscalNumber)}</h2>
          <button type="button" class="icon-btn" id="closeInvoice">×</button>
        </div>

        <div class="invoice" id="invoice-print">
          <h1 class="invoice-business-name">${escapeHtml(businessName)}</h1>
          ${ownerName ? `<div class="invoice-owner-name">${escapeHtml(ownerName)}</div>` : ""}
          <div class="invoice-fiscal-meta">
            ${cfg.cuit ? `CUIT: ${escapeHtml(cfg.cuit)}` : ""}
            ${cfg.taxStatus ? ` · ${escapeHtml(cfg.taxStatus)}` : ""}
            ${cfg.grossIncome ? `<br>Ingresos Brutos: ${escapeHtml(cfg.grossIncome)}` : ""}
            ${cfg.taxAddress ? `<br>${escapeHtml(cfg.taxAddress)}` : ""}
          </div>

          <div class="invoice-divider"></div>

          <div class="invoice-type">${escapeHtml(fiscal.voucherType || "FACTURA C")}</div>
          <div class="invoice-number">Pto. Venta ${escapeHtml(String(pointOfSale).padStart(5,"0"))} · Nº ${escapeHtml(fiscalNumber)}</div>
          <div class="invoice-number">${formatDate(sale.createdAt)}</div>

          <div class="invoice-divider"></div>

          ${authorized
            ? `<div class="fiscal-ok-note"><strong>Comprobante autorizado por ARCA</strong></div>`
            : pending
              ? `<div class="fiscal-note"><strong>Pendiente de autorización ARCA.</strong><br>${escapeHtml(fiscal.error || "")}</div>`
              : `<div class="fiscal-note"><strong>Comprobante interno.</strong><br>La facturación fiscal estaba desactivada para esta operación.</div>`}

          <div class="invoice-customer">
            <strong>Receptor:</strong> ${escapeHtml(sale.customerName || "Consumidor Final")}<br>
            <strong>Condición IVA:</strong> ${escapeHtml(taxStatusLabel(sale.customerTaxStatus))}
            ${sale.customerDocNumber ? `<br><strong>Documento:</strong> ${escapeHtml(sale.customerDocNumber)}` : ""}
          </div>

          <div class="invoice-sale-meta" style="margin-top:5px">
            Vendedor: ${escapeHtml(sale.sellerName)} · Forma de cobro: ${escapeHtml(sale.paymentMethod)}
          </div>

          <div class="invoice-divider"></div>

          <table>
            <thead><tr><th>Artículo</th><th>Cant.</th><th>Precio</th><th>Subtotal</th></tr></thead>
            <tbody>
              ${sale.items.map(item => `<tr>
                <td>${escapeHtml(item.name)}</td>
                <td>${item.saleType === "weight" ? `${Number(item.qty || 0).toLocaleString("es-AR", {minimumFractionDigits:3,maximumFractionDigits:3})} kg` : item.qty}</td>
                <td>${money(item.unitPrice)}${item.saleType === "weight" ? " / kg" : ""}</td>
                <td>${money(item.subtotal)}</td>
              </tr>`).join("")}
            </tbody>
          </table>

          <div class="invoice-total">TOTAL: ${money(sale.total)}</div>

          ${authorized ? `
            <div class="invoice-divider"></div>
            <div class="invoice-cae">
              <strong>CAE:</strong> ${escapeHtml(fiscal.cae)}<br>
              <strong>Vto. CAE:</strong> ${escapeHtml(formatArcaCompactDate(fiscal.caeExpiry))}
            </div>
            ${qrImage}
            <div class="invoice-note">Comprobante electrónico autorizado por ARCA</div>
          ` : ""}

          ${authorized && !qrImage && fiscal.qrUrl ? `<div class="invoice-note"><strong>QR fiscal:</strong> la factura está autorizada, pero no se pudo dibujar la imagen. No reintentar la emisión. Cerrá y volvé a abrir el comprobante o revisá el módulo de impresión.</div>` : ""}
        </div>

        <div class="actions no-print">
          <button type="button" class="btn secondary" id="closeInvoiceBottom">Cerrar</button>
          ${pending && state.settings.fiscal.enabled ? `<button type="button" class="btn secondary" id="retryFiscal">Reintentar autorización</button>` : ""}
          <button type="button" class="btn" id="printInvoice">Imprimir factura</button>
        </div>
      </div>`;

    document.body.appendChild(modal);
    const close = () => {
      modal.remove();
      invoiceSaleId = null;
      if (route === "sales") renderAppShell();
    };

    document.getElementById("closeInvoice").addEventListener("click", close);
    document.getElementById("closeInvoiceBottom").addEventListener("click", close);
    document.getElementById("printInvoice").addEventListener("click", () => window.print());
    document.getElementById("retryFiscal")?.addEventListener("click", async () => {
      await requestFiscalAuthorization(sale);
      modal.remove();
      openInvoiceModal(sale);
    });
  }

  function renderUsers(page) {
    page.innerHTML = `
      <div class="page-shell panel-body-scroll">
      <section class="panel panel-fill" style="margin-top:0">
        <div class="panel-header"><div><h2>Usuarios del sistema</h2><p class="muted">El administrador puede crear vendedores y consultar sus resultados.</p></div><button type="button" class="btn" id="addSeller">+ Crear vendedor</button></div>
        <div class="panel-body-scroll"><div class="user-grid">${state.users.map(user => `
          <div class="user-card">
            <span class="role-badge ${user.role}">${user.role === "admin" ? "Administrador" : "Vendedor"}</span>
            <strong>${escapeHtml(user.name)}</strong><small class="muted">${escapeHtml(user.username)}</small>
            <div style="margin-top:12px"><small class="muted">Ventas: ${state.sales.filter(sale => sale.sellerId === user.id).length} · Total: ${money(state.sales.filter(sale => sale.sellerId === user.id).reduce((sum,sale)=>sum+sale.total,0))}</small></div>
            ${user.role !== "admin" ? `<button type="button" class="btn danger small delete-user" data-id="${user.id}" style="margin-top:12px">Eliminar</button>` : ""}
          </div>`).join("")}</div></div>
      </section>`;
    document.getElementById("addSeller").addEventListener("click", () => openUserModal("seller", false));
    document.querySelectorAll(".delete-user").forEach(button => button.addEventListener("click", () => {
      const user = state.users.find(item => item.id === button.dataset.id);
      if (!user || user.role === "admin") return;
      if (state.sales.some(sale => sale.sellerId === user.id)) return toast("No se puede eliminar un vendedor con ventas registradas.", "error");
      if (!confirm(`¿Eliminar al usuario ${user.name}?`)) return;
      state.users = state.users.filter(item => item.id !== user.id);
      saveState();
      renderAppShell();
    }));
  }

  if (!DEMO_MODE && "serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(error => console.warn("Service Worker:", error)));
  }

  ensureOfficialDemoChrome();
  initializeLicense();
})();

  </script>
