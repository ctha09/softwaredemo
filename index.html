<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101216" />
  <meta name="description" content="GestOK - Demostración oficial guiada del sistema de ventas" />
  <title>GestOK | Demostración Oficial</title>
  <style>
:root {
  --bg: #101216;
  --panel: rgba(26, 29, 36, 0.94);
  --panel-2: #1a1d24;
  --line: rgba(255, 184, 102, 0.18);
  --text: #fafafa;
  --muted: #a1a1aa;
  --primary: #ff7a1a;
  --primary-2: #ffb866;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --disabled: #3f3f46;
  --shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  --radius: 20px;
}

* { box-sizing: border-box; }
html { color-scheme: dark; height: 100%; overflow: hidden; }
body {
  margin: 0;
  min-height: 100vh;
  height: 100vh;
  overflow: hidden;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--text);
  background:
    radial-gradient(circle at 15% 20%, rgba(255, 122, 26, 0.26), transparent 32%),
    radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.12), transparent 30%),
    var(--bg);
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }
.hidden { display: none !important; }


.license-screen {
  min-height:100vh; height:100vh; display:grid; place-items:center; padding:24px; overflow:auto;
  background:
    radial-gradient(circle at 18% 18%, rgba(255,122,26,.20), transparent 30%),
    radial-gradient(circle at 82% 82%, rgba(245,158,11,.10), transparent 28%),
    var(--bg);
}
.license-shell {
  width:min(980px,100%); display:grid; grid-template-columns:minmax(300px,.82fr) minmax(360px,1.18fr);
  gap:18px; align-items:stretch;
}
.license-brand, .license-card {
  border:1px solid var(--line); border-radius:24px; background:rgba(26,29,36,.94); box-shadow:var(--shadow);
}
.license-brand { padding:30px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; position:relative; }
.license-brand::after { content:""; position:absolute; width:260px; height:260px; border-radius:50%; background:rgba(255,122,26,.10); right:-120px; bottom:-120px; filter:blur(4px); }
.license-logo { font-size:clamp(2.8rem,8vw,5.2rem); font-weight:950; letter-spacing:-.075em; line-height:.9; position:relative; z-index:1; }
.license-logo span { color:var(--primary); }
.license-brand p { color:var(--muted); max-width:34ch; line-height:1.5; position:relative; z-index:1; }
.license-feature-list { display:grid; gap:10px; margin-top:28px; position:relative; z-index:1; }
.license-feature { display:flex; gap:10px; align-items:flex-start; color:#e4e4e7; font-size:.9rem; }
.license-feature b { color:#bbf7d0; }
.license-card { padding:28px; }
.license-card h1 { margin:6px 0 8px; font-size:1.8rem; }
.license-install-box { margin:20px 0; padding:16px; border-radius:18px; background:rgba(255,122,26,.08); border:1px solid rgba(255,122,26,.24); }
.license-install-box small { display:block; color:var(--muted); margin-bottom:6px; }
.license-install-id { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.license-install-id code { color:#ffedd5; font-size:1.12rem; font-weight:900; letter-spacing:.08em; word-break:break-all; }
.license-input { min-height:118px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:.76rem; line-height:1.45; }
.license-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
.license-actions .btn { flex:1; min-width:150px; }
.license-status-box { display:none; margin-top:14px; padding:12px 14px; border-radius:14px; font-size:.86rem; line-height:1.45; }
.license-status-box.show { display:block; }
.license-status-box.error { background:rgba(239,68,68,.10); border:1px solid rgba(239,68,68,.25); color:#fecaca; }
.license-status-box.success { background:rgba(34,197,94,.10); border:1px solid rgba(34,197,94,.25); color:#bbf7d0; }
.license-help { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:.82rem; line-height:1.5; }

.license-contact-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.license-contact-guide {
  margin-top:10px; padding:10px 12px; border-radius:13px;
  border:1px solid rgba(255,122,26,.18); background:rgba(255,122,26,.07);
  color:#d4d4d8; font-size:.79rem; line-height:1.45;
}
.license-contact-guide strong { color:#ffedd5; }
.license-contact-guide .contact-number { color:var(--primary-2); font-weight:800; white-space:nowrap; }
.btn.whatsapp-contact {
  border-color:rgba(255,122,26,.34); background:rgba(255,122,26,.10); color:#fff7ed;
}
.btn.whatsapp-contact:hover { background:rgba(255,122,26,.17); border-color:rgba(255,122,26,.52); }
.monthly-contact-row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.license-active-badge { display:inline-flex; align-items:center; gap:7px; margin-top:12px; padding:7px 10px; border-radius:999px; background:rgba(34,197,94,.10); border:1px solid rgba(34,197,94,.22); color:#bbf7d0; font-size:.76rem; font-weight:800; }
@media (max-width:780px) {
  .license-shell { grid-template-columns:1fr; }
  .license-brand { min-height:240px; }
}

.screen {
  min-height: 100vh;
  height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  overflow: hidden;
}

.cinematic {
  position: relative;
  overflow: hidden;
  text-align: center;
  background:
    linear-gradient(rgba(3, 7, 18, 0.54), rgba(3, 7, 18, 0.88)),
    radial-gradient(circle at center, rgba(255, 122, 26, 0.32), transparent 42%);
}
.cinematic::before,
.cinematic::after {
  content: "";
  position: absolute;
  width: 42vw;
  height: 42vw;
  border: 1px solid rgba(255, 184, 102, 0.26);
  border-radius: 50%;
  animation: orbit 8s linear infinite;
}
.cinematic::after { width: 62vw; height: 62vw; animation-duration: 12s; animation-direction: reverse; }
.cinematic-content { position: relative; z-index: 1; }
.brand-word {
  margin: 0;
  font-size: clamp(4rem, 14vw, 9rem);
  letter-spacing: -0.08em;
  line-height: 0.85;
  animation: brandIn 900ms cubic-bezier(.2,.85,.2,1) both;
}
.brand-word span { color: var(--primary-2); }
.tagline {
  margin-top: 28px;
  color: #ffedd5;
  font-size: clamp(1rem, 2.6vw, 1.65rem);
  letter-spacing: 0.08em;
  opacity: 0;
  transform: translateY(16px);
  animation: taglineIn 700ms 700ms ease forwards;
}
.tagline::before {
  content: "";
  display: inline-block;
  width: 0;
  height: 2px;
  margin-right: 16px;
  vertical-align: middle;
  background: linear-gradient(90deg, transparent, var(--primary-2));
  animation: lineGrow 850ms 500ms ease forwards;
}
.cinematic .skip {
  position: absolute;
  z-index: 2;
  right: 24px;
  bottom: 24px;
}

/* Bienvenida de sesión: se reproduce cada vez que un usuario ingresa */
.session-welcome-screen {
  background:
    linear-gradient(rgba(16,18,22,.64), rgba(16,18,22,.92)),
    radial-gradient(circle at 50% 46%, rgba(255,122,26,.32), transparent 38%),
    var(--bg);
}
.session-welcome-content {
  width: min(92vw, 760px);
  display: grid;
  justify-items: center;
}
.session-welcome-logo-wrap {
  width: 106px;
  height: 106px;
  border-radius: 28px;
  display: grid;
  place-items: center;
  margin-bottom: 22px;
  background: rgba(255,122,26,.15);
  border: 1px solid rgba(255,184,102,.32);
  box-shadow: 0 18px 54px rgba(255,122,26,.18), inset 0 0 28px rgba(255,122,26,.10);
  animation: sessionLogoIn .75s cubic-bezier(.2,.85,.2,1) both;
}
.session-welcome-business-logo {
  width: 78px;
  height: 78px;
  object-fit: contain;
  border-radius: 18px;
  background: rgba(255,255,255,.96);
  padding: 7px;
}
.session-welcome-logo-fallback {
  width: 76px;
  height: 76px;
  display: grid;
  place-items: center;
  border-radius: 20px;
  background: var(--primary);
  color: white;
  font-size: 2.1rem;
  font-weight: 900;
}
.session-welcome-eyebrow {
  margin-bottom: 12px;
  animation: sessionTextIn .55s .2s ease both;
}
.session-welcome-title {
  margin: 0;
  font-size: clamp(2.15rem, 5.6vw, 4.7rem);
  line-height: 1.02;
  letter-spacing: -.045em;
  animation: sessionTextIn .65s .32s ease both;
}
.session-welcome-title span { color: var(--primary-2); }
.session-welcome-subtitle {
  margin: 14px 0 0;
  color: #fed7aa;
  font-size: clamp(.92rem, 2vw, 1.18rem);
  letter-spacing: .04em;
  animation: sessionTextIn .65s .48s ease both;
}
.session-welcome-loader {
  width: min(280px, 58vw);
  height: 4px;
  margin-top: 32px;
  border-radius: 999px;
  overflow: hidden;
  background: rgba(255,255,255,.08);
  animation: sessionTextIn .45s .62s ease both;
}
.session-welcome-loader span {
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: left center;
  background: linear-gradient(90deg, var(--primary), var(--primary-2));
  animation: sessionWelcomeProgress 2.25s .15s linear both;
}
@keyframes sessionLogoIn {
  from { opacity: 0; transform: translateY(18px) scale(.72) rotate(-5deg); }
  to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
}
@keyframes sessionTextIn {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes sessionWelcomeProgress {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

.card {
  width: min(100%, 720px);
  padding: 32px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--panel);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}
.card.narrow { width: min(100%, 520px); }
.card h1, .card h2, .card h3 { margin-top: 0; }
.eyebrow { margin: 0 0 8px; color: var(--primary-2); font-weight: 750; letter-spacing: .08em; text-transform: uppercase; font-size: .78rem; }
.muted { color: var(--muted); }

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.field { display: grid; gap: 8px; }
.field.full { grid-column: 1 / -1; }
label { color: #cbd5e1; font-size: .9rem; font-weight: 650; }
input, select, textarea {
  width: 100%;
  border: 1px solid rgba(148, 163, 184, 0.28);
  border-radius: 12px;
  background: rgba(2, 6, 23, 0.46);
  color: var(--text);
  padding: 12px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--primary-2);
  box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.16);
}
input[type="file"] { padding: 10px; }
.actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.btn {
  border: 0;
  border-radius: 12px;
  padding: 11px 16px;
  color: white;
  background: var(--primary);
  font-weight: 750;
  transition: transform .15s, filter .15s;
}
.btn:hover { transform: translateY(-1px); filter: brightness(1.08); }
.btn.secondary { background: #2b2f36; color: #f4f4f5; }
.btn.success { background: var(--success); color: #052e16; }
.btn.danger { background: var(--danger); }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.small { padding: 8px 11px; font-size: .86rem; }
.icon-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
  background: rgba(15, 23, 42, .75); color: white; font-size: 1.1rem;
}
.logo-preview {
  width: 100px; height: 100px; display: grid; place-items: center; overflow: hidden;
  border: 1px dashed rgba(148,163,184,.4); border-radius: 18px; background: rgba(255,255,255,.04);
}
.logo-preview img { width: 100%; height: 100%; object-fit: contain; }

.user-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-top: 20px; }
.user-card {
  padding: 18px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(2, 6, 23, .34);
}
.user-card strong { display: block; margin-bottom: 4px; }
.role-badge, .status-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 9px; border-radius: 999px;
  font-size: .75rem; font-weight: 800;
}
.role-badge.admin { color: #ffedd5; background: rgba(255,122,26,.22); }
.role-badge.seller { color: #d1fae5; background: rgba(33,196,123,.18); }

.login-layout { display: grid; grid-template-columns: minmax(220px, .8fr) minmax(280px, 1.2fr); gap: 20px; align-items: stretch; }
.business-box { padding: 24px; border-radius: 18px; background: linear-gradient(145deg, rgba(255,122,26,.22), rgba(16,18,22,.5)); border: 1px solid var(--line); }
.business-logo { width: 84px; height: 84px; object-fit: contain; border-radius: 18px; background: white; padding: 8px; }

.app-shell {
  min-height: 100vh;
  height: 100vh;
  padding: 24px;
  display: grid;
  place-items: center;
  overflow: hidden;
}
.main {
  width: min(1240px, 100%);
  min-width: 0;
  height: calc(100vh - 48px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.main.dashboard-only {
  width: 100%;
  justify-content: center;
}
.minimal-topbar {
  min-height: 74px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 22px;
  margin-bottom: 18px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: rgba(7,17,31,.72);
  backdrop-filter: blur(14px);
}
.minimal-topbar h1 { margin: 0; font-size: 1.35rem; }
.topbar-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.content { padding: 0; flex: 1; min-height: 0; overflow: hidden; }
.page-shell { height: 100%; min-height: 0; }
.panel-fill { height: 100%; min-height: 0; display: flex; flex-direction: column; }
.panel-body-scroll { flex: 1; min-height: 0; overflow: auto; padding-right: 4px; }
.fixed-table-wrap { width: 100%; flex: 1; min-height: 0; overflow: auto; }
.dashboard-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.metric {
  padding: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
}
.metric span { color: var(--muted); font-size: .84rem; }
.metric strong { display: block; margin-top: 8px; font-size: 1.7rem; }
.metric .trend { font-size: .8rem; margin-top: 8px; color: var(--success); }
.metric .trend.down { color: var(--danger); }

.panel {
  margin-top: 18px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--panel);
  overflow: hidden;
}
.panel-header { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
.panel-header h2, .panel-header h3 { margin: 0; }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar input { width: min(280px, 70vw); }
.products-sector-filter { min-width: 210px; }
.products-filter-count { color: var(--muted); font-size: .82rem; margin-left: auto; white-space: nowrap; }

.table-wrap { width: 100%; overflow: auto; }
table { width: 100%; border-collapse: collapse; min-width: 720px; }
th, td { padding: 13px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
th { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
td { font-size: .92rem; }
.product-thumb { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: #fff; }

.product-transfer-actions {
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.btn.transfer {
  background: rgba(255,122,26,.13);
  border:1px solid rgba(255,122,26,.32);
  color:#ffedd5;
}
.btn.transfer:hover { background: rgba(255,122,26,.22); }
.import-preview-table { max-height:260px; overflow:auto; border:1px solid var(--line); border-radius:12px; margin-top:14px; }
.import-preview-table table { min-width:650px; }
.import-summary-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin:14px 0; }
.import-summary-card { padding:12px; border:1px solid var(--line); border-radius:12px; background:rgba(255,255,255,.025); }
.import-summary-card small { display:block; color:var(--muted); margin-bottom:3px; }
.import-summary-card strong { font-size:1.15rem; }
.transfer-note { margin:10px 0 0; padding:10px 12px; border-radius:12px; background:rgba(245,158,11,.08); border:1px solid rgba(245,158,11,.18); color:#fde68a; font-size:.82rem; }
@media (max-width:760px) {
  .product-transfer-actions { justify-content:flex-start; width:100%; }
  .import-summary-grid { grid-template-columns:1fr; }
}

.stock-low { color: var(--warning); font-weight: 800; }
.stock-zero { color: var(--danger); font-weight: 800; }

.weight-product-badge {
  display:inline-flex; align-items:center; gap:5px; margin-top:4px; padding:4px 7px;
  border-radius:999px; border:1px solid rgba(255,122,26,.22); background:rgba(255,122,26,.10);
  color:#fed7aa; font-size:.67rem; font-weight:800;
}
.scale-config-note {
  margin-top:10px; padding:11px 12px; border-radius:13px; border:1px solid rgba(255,122,26,.20);
  background:rgba(255,122,26,.08); color:#fed7aa; font-size:.82rem; line-height:1.4;
}
.scale-preview {
  margin-top:12px; padding:12px; border-radius:14px; border:1px solid var(--line); background:rgba(255,255,255,.025);
}
.scale-preview strong { display:block; margin-bottom:5px; }
.scale-preview-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:8px; }
.scale-preview-item { padding:8px 10px; border-radius:10px; background:rgba(0,0,0,.14); }
.scale-preview-item small { display:block; color:var(--muted); margin-bottom:2px; }
.weight-line-note { display:block; margin-top:3px; color:#fed7aa; font-size:.72rem; font-weight:700; }
.weight-qty-display {
  display:inline-flex; align-items:center; gap:6px; padding:5px 7px; border-radius:9px; background:rgba(255,122,26,.10); color:#fed7aa;
}
.weight-qty-display button {
  width:24px; height:24px; border-radius:7px; border:0; background:#2b2f36; color:white; padding:0;
}
.scale-reader-status {
  display:flex; align-items:center; gap:7px; color:#a1a1aa; font-size:.72rem; margin-top:4px;
}
.scale-reader-status .dot { width:7px; height:7px; border-radius:50%; background:#22c55e; }
@media (max-width:760px) { .scale-preview-grid { grid-template-columns:1fr; } }

.terminal-sales-screen { display:grid; grid-template-rows: auto auto minmax(0,1fr); gap: 8px; height:100%; min-height:0; }
.terminal-topbar {
  margin-top: 0;
  padding: 7px 10px;
  display:grid;
  grid-template-columns: auto 1fr auto;
  align-items:center;
  gap: 12px;
}
.terminal-title-block h2 { margin: 0 0 1px; font-size: 1.22rem; line-height: 1.02; }
.terminal-title-block p { margin: 0; color: var(--muted); font-size: .78rem; }
.terminal-center-tools { display:flex; justify-content:center; }
.terminal-status-badge {
  justify-self:end;
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid rgba(34,197,94,.24);
  background: rgba(34,197,94,.12);
  color: #bbf7d0;
  font-size: .82rem;
  font-weight: 700;
}
.terminal-status-badge.pending {
  background: rgba(245,158,11,.12);
  border-color: rgba(245,158,11,.24);
  color: #fde68a;
}
.terminal-scanbar {
  margin-top: 0;
  padding: 0;
  border: none;
  background: transparent;
  display:grid;
  grid-template-columns: minmax(0,1fr) auto;
  gap: 12px;
}
.scan-input-shell {
  display:flex;
  align-items:center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 16px;
  border: 1px solid rgba(255,122,26,.52);
  background: rgba(19,38,65,.72);
  box-shadow: inset 0 0 0 1px rgba(255,122,26,.13);
}
.scan-input-shell span { color: var(--primary); font-size: 1.1rem; }
.scan-input-shell input {
  flex:1;
  border:0 !important;
  background: transparent !important;
  padding: 0 !important;
  box-shadow: none !important;
}
.scan-input-shell input:focus { outline:none; }
.terminal-stage { display:grid; grid-template-columns: minmax(0,1.52fr) minmax(320px,.66fr); gap: 10px; min-height:0; height:100%; overflow:hidden; }
.terminal-cart-board,
.terminal-side-stack { min-height:0; }
.terminal-cart-board { display:flex; flex-direction:column; }
.terminal-cart-card {
  margin-top:0;
  padding:0;
  display:grid;
  grid-template-rows: auto minmax(0,1fr) auto;
  min-height:0;
  height:100%;
}
.terminal-cart-head {
  display:grid;
  grid-template-columns: minmax(0,1.35fr) repeat(3, minmax(82px,.5fr));
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255,255,255,.03);

.orbital-panel {
  position: relative;
  min-height: 0;
  height: calc(100vh - 148px);
  display: grid;
  place-items: center;
  overflow: hidden;
  isolation: isolate;
  padding-top: 4px;
}
.orbital-wrapper {
  position: relative;
  width: min(720px, 94vw, calc(100vh - 210px));
  height: min(720px, 94vw, calc(100vh - 210px));
  z-index: 1;
}
.orbital-ring,
.orbital-ring::before,
.orbital-ring::after {
  position: absolute;
  inset: 50%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
}
.orbital-ring {
  width: 68%;
  height: 68%;
  border: 1px solid rgba(86,168,255,.20);
  box-shadow: inset 0 0 50px rgba(255,122,26,.10);
  animation: ringPulse 4.2s ease-in-out infinite;
}
.orbital-ring::before,
.orbital-ring::after {
  content: '';
  border: 1px dashed rgba(148,163,184,.14);
}
.orbital-ring::before { width: 84%; height: 84%; }
.orbital-ring::after { width: 112%; height: 112%; }
.orbital-core {
  position: absolute;
  z-index: 5;
  inset: 50% auto auto 50%;
  transform: translate(-50%, -50%);
  width: 220px;
  height: 220px;
  border-radius: 50%;
  border: 1px solid rgba(148,163,184,.18);
  background: radial-gradient(circle at 30% 30%, rgba(255,122,26,.20), rgba(7,17,31,.96));
  box-shadow: 0 20px 50px rgba(0,0,0,.36), inset 0 0 40px rgba(255,122,26,.15);
  display: grid;
  place-items: center;
  text-align: center;
  padding: 20px;
  animation: coreFloat 3.6s ease-in-out infinite;
  transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
}
.orbital-core:hover {
  transform: translate(-50%, -50%) scale(1.02);
  border-color: rgba(86,168,255,.42);
  box-shadow: 0 24px 56px rgba(0,0,0,.42), inset 0 0 40px rgba(255,122,26,.22);
}
.orbital-core-btn {
  all: unset;
  position: relative;
  z-index: 6;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  display: grid;
  place-items: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.orbital-core-btn:active {
  transform: scale(.98);
}
.orbital-core img {
  width: 82px;
  height: 82px;
  object-fit: contain;
  background: white;
  border-radius: 20px;
  padding: 8px;
  margin-bottom: 10px;
}
.orbital-core .core-fallback {
  width: 82px;
  height: 82px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  background: var(--primary);
  font-size: 2rem;
  font-weight: 900;
  margin: 0 auto 10px;
}
.orbital-core strong { display: block; font-size: 1.18rem; }
.orbital-core small { color: #cbd5e1; display:block; }
.core-hint {
  margin-top: 8px;
  font-size: .75rem;
  color: #ffb866;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.orbit-system {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  transform: rotate(0deg);
}
.orbital-wrapper.expanded .orbit-system { transform: rotate(180deg); pointer-events: auto; }
.orbital-wrapper.expanding .orbit-system { animation: orbitSpinForward 3s ease-in-out forwards; }
.orbit-item {
  position: absolute;
  inset: 50% auto auto 50%;
  width: 136px;
  min-height: 112px;
  border: 1px solid rgba(148,163,184,.18);
  border-radius: 22px;
  background: rgba(10, 20, 35, .88);
  color: white;
  box-shadow: var(--shadow);
  padding: 12px 10px;
  display: grid;
  place-items: center;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(.3);
  transition: opacity .2s ease;
}
.orbital-wrapper.expanded .orbit-item,
.orbital-wrapper.expanding .orbit-item {
  opacity: 1;
}
.orbital-wrapper.expanded .orbit-item {
  pointer-events: auto;
  transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1)) rotate(calc(var(--angle) * -1));
}
.orbital-wrapper.expanding .orbit-item {
  animation: orbitAppear 700ms cubic-bezier(.2,.85,.2,1) forwards;
  animation-delay: var(--delay, 0ms);
}
.orbit-item:hover { border-color: rgba(86,168,255,.65); background: rgba(19, 37, 64, .95); }
.orbit-item-inner {
  display: grid;
  place-items: center;
  gap: 6px;
  width: 100%;
  transition: transform .25s ease;
}
.orbital-wrapper.expanded .orbit-item-inner { transform: rotate(-180deg); }
.orbital-wrapper.expanding .orbit-item-inner { animation: orbitCounterSpin 3s ease-in-out forwards; }
.orbit-item .orbit-icon {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  background: rgba(255,122,26,.20);
  color: #ffedd5;
  font-size: 1.35rem;
}
.orbit-item strong { font-size: .95rem; }
.orbit-item small { color: var(--muted); font-size: .74rem; }
@keyframes coreFloat {
  0%, 100% { transform: translate(-50%, -50%) translateY(0); }
  50% { transform: translate(-50%, -50%) translateY(-8px); }
}
@keyframes ringPulse {
  0%, 100% { opacity: .9; box-shadow: inset 0 0 50px rgba(255,122,26,.10); }
  50% { opacity: 1; box-shadow: inset 0 0 70px rgba(255,122,26,.20); }
}
@keyframes orbitSpinForward {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(180deg); }
}
@keyframes orbitCounterSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(-180deg); }
}
@keyframes orbitAppear {
  0% {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.28);
  }
  40% {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -.62)) rotate(calc(var(--angle) * -1)) scale(1.04);
  }
  70% {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1.06)) rotate(calc(var(--angle) * -1)) scale(.98);
  }
  100% {
    opacity: 1;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(calc(var(--radius) * -1)) rotate(calc(var(--angle) * -1)) scale(1);
  }
}

}
.arca-step-card:first-child { margin-top:0; }

.arca-step-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }

}
.arca-tour-board {

.arca-tour-board::before {

.arca-tour-title { position:relative; z-index:2; display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }

.arca-tour-canvas {

}
.arca-node {

}
.arca-node strong { display:block; margin-bottom:6px; }
.arca-node small { color:var(--muted); line-height:1.35; display:block; }
.arca-node .tag {

}
.arca-node.data { top:18px; left:18px; }
.arca-node.cert { top:18px; right:18px; }
.arca-node.bridge { top:190px; left:50%; transform:translateX(-50%); width:210px; }
.arca-node.arca { bottom:18px; left:18px; }
.arca-node.invoice { bottom:18px; right:18px; }
.arca-link {
  position:absolute; height:2px; background:linear-gradient(90deg, rgba(255,122,26,.16), rgba(255,184,102,.60), rgba(255,122,26,.16));
  transform-origin:left center; border-radius:999px;
}
.arca-link::after {
  content:""; position:absolute; right:-2px; top:50%; width:8px; height:8px; border-radius:50%; background:var(--primary-2); transform:translateY(-50%);
  box-shadow:0 0 10px rgba(255,184,102,.45);
}
.arca-link.a { top:110px; left:180px; width:120px; transform:rotate(18deg); }
.arca-link.b { top:110px; right:180px; width:120px; transform:rotate(-18deg); }
.arca-link.c { top:290px; left:170px; width:150px; transform:rotate(18deg); }
.arca-link.d { top:290px; right:170px; width:150px; transform:rotate(-18deg); }
.arca-pointer {
  position:absolute; top:42px; left:42px; font-size:1.6rem; filter:drop-shadow(0 6px 10px rgba(0,0,0,.28));
  animation:arcaPointerMove 12s ease-in-out infinite;
}
.arca-pulse {
  position:absolute; width:18px; height:18px; border-radius:50%; border:2px solid rgba(255,184,102,.72); background:rgba(255,122,26,.18);
  animation:arcaPulse 2.2s ease-in-out infinite;
}
.arca-pulse.p1 { top:82px; left:168px; }
.arca-pulse.p2 { top:82px; right:168px; animation-delay:.4s; }
.arca-pulse.p3 { top:254px; left:50%; transform:translateX(-50%); animation-delay:.8s; }
.arca-pulse.p4 { bottom:86px; left:176px; animation-delay:1.2s; }
.arca-pulse.p5 { bottom:86px; right:176px; animation-delay:1.6s; }
.arca-checklist {
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:18px;
}
.arca-check-card {
  padding:16px; border-radius:18px; border:1px solid var(--line); background:rgba(255,255,255,.02);
}
.arca-check-card h4 { margin:0 0 8px; }
.arca-list { margin:0; padding-left:18px; color:var(--muted); }
.arca-list li { margin:6px 0; }
@keyframes arcaPointerMove {
  0%, 8% { top:42px; left:42px; }
  16%, 24% { top:42px; left:calc(100% - 94px); }
  32%, 44% { top:214px; left:50%; transform:translateX(-50%); }
  52%, 64% { top:355px; left:54px; transform:none; }
  72%, 84% { top:355px; left:calc(100% - 98px); }
  100% { top:42px; left:42px; }
}
@keyframes arcaPulse {
  0%, 100% { transform:scale(.92); opacity:.7; }
  50% { transform:scale(1.12); opacity:1; }
}
@media (max-width: 760px) {
  .fiscal-grid { grid-template-columns: 1fr; }
}

@media print {
  @page { size: 80mm auto; margin: 0; }
  html, body { width:80mm !important; min-width:80mm !important; height:auto !important; overflow:visible !important; background:#fff !important; }
  body * { visibility: hidden !important; }
  #invoice-print, #invoice-print * { visibility: visible !important; }
  #invoice-print {
    position:absolute;
    left:0;
    top:0;
    width:80mm !important;
    max-width:80mm !important;
    padding:4mm !important;
    margin:0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
  }
  .no-print { display:none !important; }
}

  function getInstallationId() {
    let id = localStorage.getItem(INSTALLATION_ID_KEY);
    if (id) return id;
    const bytes = new Uint8Array(6);
    crypto.getRandomValues(bytes);
    const hex = [...bytes].map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    id = `GOK-${hex.slice(0,4)}-${hex.slice(4,8)}-${hex.slice(8,12)}`;
    localStorage.setItem(INSTALLATION_ID_KEY, id);
    return id;
  }

  function base64UrlToBytes(value) {
    const base64 = String(value || "").replace(/-/g, "+").replace(/_/g, "/") + "===".slice((String(value || "").length + 3) % 4);
    const binary = atob(base64);
    return Uint8Array.from(binary, ch => ch.charCodeAt(0));
  }

  function bytesToText(bytes) {
    return new TextDecoder().decode(bytes);
  }

  async function getLicensePublicKey() {
    const spki = Uint8Array.from(atob(LICENSE_PUBLIC_SPKI_B64), ch => ch.charCodeAt(0));
    return crypto.subtle.importKey(
      "spki",
      spki,
      { name: "ECDSA", namedCurve: "P-256" },
      false,
      ["verify"]
    );
  }

  async function verifySignedLicenseToken(token, expectedType) {
    try {
      const clean = String(token || "").trim();
      const parts = clean.split(".");
      if (parts.length !== 2) return { ok:false, reason:"Formato de licencia incorrecto." };
      const payloadBytes = base64UrlToBytes(parts[0]);
      const signatureBytes = base64UrlToBytes(parts[1]);
      const payload = JSON.parse(bytesToText(payloadBytes));
      if (payload.product !== "GestOK" || Number(payload.version) !== 1) return { ok:false, reason:"La licencia no corresponde a esta versión de GestOK." };
      if (payload.installationId !== getInstallationId()) return { ok:false, reason:"Esta licencia corresponde a otro equipo/instalación." };
      if (payload.type !== expectedType) return { ok:false, reason:"El tipo de licencia no corresponde a este campo." };
      const key = await getLicensePublicKey();
      const validSignature = await crypto.subtle.verify(
        { name:"ECDSA", hash:"SHA-256" },
        key,
        signatureBytes,
        payloadBytes
      );
      if (!validSignature) return { ok:false, reason:"La firma digital de la licencia no es válida." };
      return { ok:true, payload, token:clean };
    } catch (error) {
      console.error("Licencia:", error);
      return { ok:false, reason:"No se pudo validar la licencia." };
    }
  }

  async function verifyLicenseToken(token) {

  function monthlyDueRaw(payload) {
    return payload?.paymentDueDate || payload?.expiresAt || "";
  }

  function monthlyDueDateParts(payload) {
    const raw = monthlyDueRaw(payload);
    if (!raw) return null;
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw)) {
      const [year, month, day] = raw.split("-").map(Number);
      return { year, month, day };
    }
    const parsed = new Date(raw);
    if (Number.isNaN(parsed.getTime())) return null;
    return { year:parsed.getFullYear(), month:parsed.getMonth()+1, day:parsed.getDate() };
  }

  function monthlyDueDateStartMs(payload) {
    const parts = monthlyDueDateParts(payload);
    if (!parts) return 0;
    return new Date(parts.year, parts.month - 1, parts.day, 0, 0, 0, 0).getTime();
  }

  function monthlyExpiryMs(payload) {
    const parts = monthlyDueDateParts(payload);
    if (!parts) return 0;
    return new Date(parts.year, parts.month - 1, parts.day, 23, 59, 59, 999).getTime();
  }

  function monthlyDueDateLabel(payload) {
    const parts = monthlyDueDateParts(payload);
    if (!parts) return "Sin fecha";
    return new Date(parts.year, parts.month - 1, parts.day).toLocaleDateString("es-AR");
  }

  function localTodayStartMs() {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0, 0).getTime();
  }

  function monthlyDaysToDue(payload = monthlyLicensePayload) {
    const due = monthlyDueDateStartMs(payload);
    if (!due) return null;
    return Math.round((due - localTodayStartMs()) / 86400000);
  }

  function monthlyDaysRemaining(payload = monthlyLicensePayload) {
    return monthlyDaysToDue(payload);
  }

  function monthlySubscriptionState(payload = monthlyLicensePayload) {
    if (!payload) {
      return {
        code:"none",
        storageEnabled:false,
        label:"Sin suscripción",
        graceRemaining:0,
        daysToDue:null,
        lateDays:0,
        lateFeePercent:10
      };
    }

    const due = monthlyDueDateStartMs(payload);
    if (!due) {
      return {
        code:"invalid",
        storageEnabled:false,
        label:"Fecha inválida",
        graceRemaining:0,
        daysToDue:null,
        lateDays:0,
        lateFeePercent:10
      };
    }

    const explicitStatus = String(payload.status || payload.subscriptionStatus || "active").toLowerCase();
    const lateFeePercent = Number(payload.lateFeePercent ?? 10) || 10;
    const daysToDue = monthlyDaysToDue(payload);

    // Estado firmado por GestOK Licencias. Una licencia pausada bloquea solo GestOK Storage.
    if (explicitStatus === "paused" || explicitStatus === "pausada" || explicitStatus === "suspended") {
      return {
        code:"paused_manual",
        storageEnabled:false,
        label:"Pausada",
        graceRemaining:0,
        daysToDue,
        lateDays:Math.max(0, -(daysToDue ?? 0)),
        lateFeePercent
      };
    }

    if (daysToDue >= 2) {
      return {
        code:"active",
        storageEnabled:true,
        label:`Activa hasta ${monthlyDueDateLabel(payload)}`,
        graceRemaining:10,
        daysToDue,
        lateDays:0,
        lateFeePercent
      };
    }

    if (daysToDue === 1) {
      return {
        code:"due_tomorrow",
        storageEnabled:true,
        label:"Vence mañana",
        graceRemaining:10,
        daysToDue,
        lateDays:0,
        lateFeePercent
      };
    }

    // El día de vencimiento empieza el período de gracia.
    // Ej.: vence 11/10 -> gracia 11/10 al 20/10 inclusive -> pausa desde 21/10.
    const lateDays = Math.max(0, -daysToDue);
    if (lateDays <= 9) {
      return {
        code:"pending",
        storageEnabled:true,
        label:"Pago pendiente",
        graceRemaining:10 - lateDays,
        daysToDue,
        lateDays,
        lateFeePercent
      };
    }

    return {
      code:"paused_late",
      storageEnabled:false,
      label:"Pausada por falta de pago",
      graceRemaining:0,
      daysToDue,
      lateDays,
      lateFeePercent
    };
  }

  function monthlyLicenseIsActive(payload = monthlyLicensePayload) {
    return Boolean(monthlySubscriptionState(payload).storageEnabled);
  }

  async function verifyMonthlyLicenseToken(token) {
    const result = await verifySignedLicenseToken(token, "cloud_monthly");
    if (!result.ok) return result;
    if (!monthlyDueDateStartMs(result.payload)) {
      return { ok:false, reason:"La licencia mensual no contiene una fecha de pago válida." };
    }
    // La fecha de pago no invalida la firma. GestOK conserva la licencia y calcula:
    // activa -> vence mañana -> pago pendiente (10 días) -> pausada.
    return result;
  }

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!saved) return structuredClone(defaultState);
      const merged = { ...structuredClone(defaultState), ...saved };
      merged.settings = {
        ...structuredClone(defaultState.settings),
        ...(saved.settings || {}),
        analytics: {
          ...structuredClone(defaultState.settings.analytics),
          ...(saved.settings?.analytics || {})
        },
        cloud: {
          ...structuredClone(defaultState.settings.cloud),
          ...(saved.settings?.cloud || {})
        },
        scaleBarcode: {
          ...structuredClone(defaultState.settings.scaleBarcode),
          ...(saved.settings?.scaleBarcode || {})
        },
        fiscal: {
          ...structuredClone(defaultState.settings.fiscal),
          ...(saved.settings?.fiscal || {})
        }
      };

      // Migración silenciosa de catálogos viejos: algunas versiones antiguas
      // permitían artículos sin ID o con IDs repetidos. Eso hacía que Editar
      // no pudiera identificar qué fila había sido pulsada.
      if (!Array.isArray(merged.products)) merged.products = [];
      const usedIds = new Set();
      merged.products = merged.products.map((product, index) => {
        const p = product && typeof product === "object" ? product : {};
        let id = String(p.id ?? "").trim();
        if (!id || usedIds.has(id)) {
          id = `prd_migrated_${Date.now()}_${index}_${Math.random().toString(36).slice(2,8)}`;
        }
        usedIds.add(id);
        return {
          ...p,
          id,
          name: String(p.name || `Artículo ${index + 1}`),
          category: String(p.category || ""),
          barcode: String(p.barcode || ""),
          saleType: p.saleType === "weight" ? "weight" : "unit",
          plu: String(p.plu || ""),
          price: Number(p.price || 0),
          cost: Number(p.cost || 0),
          stock: Number(p.stock || 0),
          minStock: Number(p.minStock ?? 3),
          image: String(p.image || "")
        };
      });

      if (!Array.isArray(merged.sales)) merged.sales = [];
      return merged;
    } catch (error) {
      console.error("No se pudo cargar el estado:", error);
      return structuredClone(defaultState);
    }
  }

      .sort((a, b) => Number(a.stock || 0) - Number(b.stock || 0));

    // Limpia cierres antiguos si el producto fue repuesto o cambió su cantidad.
    for (const key of [...dismissedLowStockAlerts]) {
      const [productId, stockValue] = key.split(":");

      }
    }

    const pending = lowProducts.filter(product => !dismissedLowStockAlerts.has(lowStockAlertKey(product)));
    if (!pending.length) {
      removeStockAlertLayer();
      return;
    }

    const product = pending[0];
    const key = lowStockAlertKey(product);
    if (activeLowStockAlertKey === key && document.getElementById("stockAlertLayer")) return;

    removeStockAlertLayer();
    activeLowStockAlertKey = key;

    const stock = Number(product.stock || 0);
    const outOfStock = stock <= 0;
    const totalLow = lowProducts.length;
    const layer = document.createElement("div");
    layer.id = "stockAlertLayer";
    layer.className = "stock-alert-layer";
    layer.innerHTML = `
      <article class="stock-alert-card ${outOfStock ? "out" : ""}" role="alert" aria-live="assertive">
        <div class="stock-alert-accent"></div>
        <div class="stock-alert-body">
          ${product.image
            ? `<img class="stock-alert-image" src="${product.image}" alt="${escapeHtml(product.name)}" />`
            : `<div class="stock-alert-icon">${outOfStock ? "!" : "⚠"}</div>`}
          <div class="stock-alert-copy">
            <div class="stock-alert-kicker">${outOfStock ? "Sin stock" : "Stock bajo"}</div>
            <strong title="${escapeHtml(product.name)}">${escapeHtml(product.name)}</strong>
            <p>${outOfStock
              ? `No queda ${product.saleType === "weight" ? "stock disponible en kg" : "ninguna unidad disponible"}. Es necesario reponer este producto.`
              : product.saleType === "weight" ? `Quedan solamente <b>${stock.toFixed(3)} kg</b>. Se recomienda realizar una reposición.` : `Quedan solamente <b>${stock}</b> unidades. Se recomienda realizar una reposición.`}</p>
            <small>${totalLow > 1 ? `${totalLow} productos están por debajo del umbral · Cerrá esta alerta para ver la siguiente.` : `Alerta automática de inventario · Umbral: menos de 5 ${product.saleType === "weight" ? "kg" : "unidades"}.`}</small>
          </div>
          <button type="button" class="stock-alert-close" id="closeStockAlert" aria-label="Cerrar alerta">×</button>
        </div>
      </article>`;
    document.body.appendChild(layer);

    document.getElementById("closeStockAlert")?.addEventListener("click", () => {
      dismissedLowStockAlerts.add(key);
      removeStockAlertLayer();
      setTimeout(checkLowStockAlerts, 80);
    });
  }

  function checkMonthlyLicenseAlert() {
    removeMonthlyLicenseAlert();
    if (!currentUser() || !isAdmin() || !monthlyLicensePayload) return;

    const status = monthlySubscriptionState();
    if (!["due_tomorrow","pending","paused_late","paused_manual"].includes(status.code)) return;

    const dueLabel = monthlyDueDateLabel(monthlyLicensePayload);
    const key = `${monthlyDueRaw(monthlyLicensePayload)}:${status.code}:${status.graceRemaining}`;
    if (dismissedMonthlyLicenseAlertKey === key) return;

    let kicker = "";
    let title = "";
    let text = "";
    let cardClass = "";

    if (status.code === "due_tomorrow") {
      kicker = "GestOK Storage · vence mañana";
      title = "Tu suscripción vence mañana";
      text = `La próxima fecha de pago es <b>${dueLabel}</b>. GestOK local seguirá funcionando normalmente.`;
      cardClass = "pending";
    } else if (status.code === "pending") {
      kicker = "GestOK Storage · pago pendiente";
      title = `Tenés ${status.graceRemaining} día${status.graceRemaining === 1 ? "" : "s"} de gracia`;
      text = `La fecha de pago fue <b>${dueLabel}</b>. Durante este plazo el respaldo administrado sigue habilitado. Si no se regulariza, se pausará y la reactivación tendrá un recargo del <b>${status.lateFeePercent}%</b>.`;
      cardClass = "pending";
    } else if (status.code === "paused_manual") {
      kicker = "GestOK Storage · suscripción pausada";
      title = "El guardado administrado está pausado";
      text = `La suscripción fue pausada. GestOK local continúa funcionando con normalidad; solamente está deshabilitado el respaldo administrado.`;
      cardClass = "paused";
    } else {
      kicker = "GestOK Storage · suscripción pausada";
      title = "Finalizó el período de gracia";
      text = `Pasaron los 10 días de gracia desde <b>${dueLabel}</b>. El guardado administrado está pausado. Para reactivarlo corresponde regularizar la cuota y se aplica un recargo del <b>${status.lateFeePercent}%</b>.`;
      cardClass = "paused";
    }

    const layer = document.createElement("div");
    layer.id = "cloudLicenseAlertLayer";
    layer.className = "cloud-license-alert-layer";
    layer.innerHTML = `
      <article class="cloud-license-alert-card ${cardClass}" role="alert" aria-live="polite">
        <div class="cloud-license-alert-accent"></div>
        <div class="cloud-license-alert-body">
          <div class="cloud-license-alert-icon">💾</div>
          <div class="cloud-license-alert-copy">
            <div class="kicker">${kicker}</div>
            <strong>${title}</strong>
            <p>${text}</p>
            <div class="cloud-license-alert-actions">
              <button class="btn small" id="openLicenseRenewal" type="button">${status.storageEnabled ? "Ver suscripción" : "Regularizar suscripción"}</button>
            </div>
          </div>
          <button class="cloud-license-alert-close" id="closeCloudLicenseAlert" type="button" aria-label="Cerrar">×</button>
        </div>
      </article>`;
    document.body.appendChild(layer);

    document.getElementById("closeCloudLicenseAlert")?.addEventListener("click", () => {
      dismissedMonthlyLicenseAlertKey = key;
      removeMonthlyLicenseAlert();
    });
    document.getElementById("openLicenseRenewal")?.addEventListener("click", () => {
      removeMonthlyLicenseAlert();
      route = "licenses";
      renderAppShell();
    });
  }

    });
  }

  function clearOfficialDemoTour() {
    document.querySelector(".demo-tour-shade")?.remove();

  function startOfficialDemoTour(section = route, force = false) {
    if (!DEMO_MODE) return;
    const steps = OFFICIAL_DEMO_TOURS[section];
    if (!Array.isArray(steps) || !steps.length) return;
    if (!force && demoToursSeen.has(section)) return;
    demoToursSeen.add(section);
    demoTourState = { section, steps, index:0 };
    showOfficialDemoTourStep();
  }

  function showOfficialDemoTourStep() {
    if (!demoTourState) return;
    document.querySelector(".demo-tour-shade")?.remove();
    document.querySelector(".demo-tour-card")?.remove();
    document.querySelectorAll(".demo-tour-target").forEach(node => node.classList.remove("demo-tour-target"));

    const step = demoTourState.steps[demoTourState.index];
    const target = document.querySelector(step.selector);
    if (!target) {
      demoTourState.index += 1;
      if (demoTourState.index >= demoTourState.steps.length) {
        clearOfficialDemoTour();
        return;
      }
      showOfficialDemoTourStep();
      return;
    }

    target.classList.add("demo-tour-target");
    target.scrollIntoView?.({block:"nearest",inline:"nearest",behavior:"smooth"});

    const shade = document.createElement("div");
    shade.className = "demo-tour-shade";
    document.body.appendChild(shade);

    const card = document.createElement("div");
    card.className = "demo-tour-card";
    card.innerHTML = `
      <div class="demo-tour-label">● Guía interactiva · ${escapeHtml(pageTitle(demoTourState.section))}</div>
      <h3>${escapeHtml(step.title)}</h3>
      <p>${escapeHtml(step.text)}</p>
      <div class="demo-tour-actions">
        <div class="demo-tour-dots">
          ${demoTourState.steps.map((_,index)=>`<span class="demo-tour-dot ${index === demoTourState.index ? "active" : ""}"></span>`).join("")}
        </div>
        <div class="demo-tour-buttons">
          <button type="button" class="btn ghost small" id="skipOfficialTour">Saltar guía</button>
          <button type="button" class="btn small" id="nextOfficialTour">${demoTourState.index === demoTourState.steps.length - 1 ? "Finalizar" : "Haz click para continuar"}</button>
        </div>
      </div>`;
    document.body.appendChild(card);

    document.getElementById("skipOfficialTour")?.addEventListener("click", clearOfficialDemoTour);
    document.getElementById("nextOfficialTour")?.addEventListener("click", () => {
      demoTourState.index += 1;
      if (demoTourState.index >= demoTourState.steps.length) {
        clearOfficialDemoTour();
        return;
      }
      showOfficialDemoTourStep();
    });
  }

  function agentNormalize(value) {
    return String(value || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9ñ\s]/g, " ").replace(/\s+/g, " ").trim();
  }

  function agentDateKey(value) {
    const date = new Date(value);
    return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
  }

  function agentVisibleSales() {
    return getVisibleSales();
  }

  function agentTodaySales(offsetDays = 0) {
    const target = new Date();
    target.setDate(target.getDate() + offsetDays);
    const key = agentDateKey(target);
    return agentVisibleSales().filter(sale => agentDateKey(sale.createdAt) === key);
  }

  function agentMonthSales() {
    const now = new Date();
    return agentVisibleSales().filter(sale => {
      const d = new Date(sale.createdAt);
      return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
    });
  }

  function agentLastDaysSales(days = 30) {
    const from = new Date();
    from.setHours(0,0,0,0);
    from.setDate(from.getDate() - (days - 1));
    return agentVisibleSales().filter(sale => new Date(sale.createdAt) >= from);
  }

  function agentSalesSummary(sales) {
    const revenue = sales.reduce((sum,sale)=>sum+Number(sale.total||0),0);
    const units = sales.flatMap(sale=>sale.items||[]).reduce((sum,item)=>sum+Number(item.qty||0),0);
    const avg = sales.length ? revenue / sales.length : 0;
    return { revenue, units, operations: sales.length, avg };
  }

  function agentTopProduct(sales, mode = "units") {
    const rows = buildProductStats(sales);
    if (!rows.length) return null;
    return rows.sort((a,b)=>Number(b[mode]||0)-Number(a[mode]||0))[0];
  }

  function agentPaymentRanking(sales) {
    const map = {};
    sales.forEach(sale => {
      const key = sale.paymentMethod || "Sin especificar";
      if (!map[key]) map[key] = { count:0, total:0 };
      map[key].count += 1;
      map[key].total += Number(sale.total||0);
    });
    return Object.entries(map).sort((a,b)=>b[1].total-a[1].total);
  }

  function agentProductRows(products, detailBuilder) {
    if (!products.length) return `<p>No encontré productos para mostrar.</p>`;
    return `<div class="agent-product-list">${products.slice(0,8).map(product => `
      <div class="agent-product-row">
        ${product.image ? `<img src="${product.image}" alt="${escapeHtml(product.name)}" />` : `<div class="agent-product-placeholder">!</div>`}
        <div><strong>${escapeHtml(product.name)}</strong><small>${detailBuilder(product)}</small></div>
      </div>`).join("")}</div>`;
  }

  function agentActionsHtml(actions = []) {
    if (!actions.length) return "";
    return `<div class="agent-inline-actions">${actions.map((action,index)=>`<button type="button" class="agent-inline-action" data-agent-action-index="${index}">${escapeHtml(action.label)}</button>`).join("")}</div>`;
  }

  function agentResponseFor(rawQuestion) {
    const q = agentNormalize(rawQuestion);
    const today = agentTodaySales(0);
    const yesterday = agentTodaySales(-1);
    const month = agentMonthSales();
    const todayData = agentSalesSummary(today);
    const monthData = agentSalesSummary(month);
    const lowStock = state.products.filter(product => Number(product.stock||0) < 5).sort((a,b)=>Number(a.stock||0)-Number(b.stock||0));
    const outStock = state.products.filter(product => Number(product.stock||0) <= 0);
    const pendingFiscal = state.sales.filter(sale => sale.fiscal?.status === "pending");
    const noCost = state.products.filter(product => Number(product.cost||0) <= 0);
    const user = currentUser();

    if (!q) return { html: `<p>Escribime una consulta o elegí una acción rápida.</p>` };

    // Navegación / acciones directas
    if ((q.includes("abrir") || q.includes("ir a") || q.includes("nueva")) && q.includes("venta")) {
      return { html:`<p>Perfecto. Puedo llevarte directamente a la terminal de ventas.</p>`, actions:[{label:"Abrir Nueva venta", route:"sales"}] };
    }
    if ((q.includes("abrir") || q.includes("ir a")) && q.includes("historial")) {
      return { html:`<p>El historial te permite revisar operaciones y comprobantes ya registrados.</p>`, actions:[{label:"Abrir Historial", route:"history"}] };
    }
    if ((q.includes("abrir") || q.includes("ir a")) && (q.includes("estadistica") || q.includes("estadisticas"))) {
      return isAdmin() ? { html:`<p>Voy a dejarte el acceso directo al panel de estadísticas.</p>`, actions:[{label:"Abrir Estadísticas",route:"statistics"}] } : { html:`<p>Las estadísticas generales están disponibles para administradores. Puedo mostrarte tus resultados personales desde acá.</p>` };
    }
    if ((q.includes("abrir") || q.includes("ir a")) && (q.includes("articulo") || q.includes("producto") || q.includes("inventario"))) {
      return isAdmin() ? { html:`<p>Desde Artículos podés revisar inventario, costos y stock.</p>`, actions:[{label:"Abrir Artículos",route:"products"}] } : { html:`<p>La edición del inventario corresponde al administrador. Igual puedo decirte qué productos tienen stock bajo.</p>`, actions:[{label:"Consultar stock bajo", prompt:"¿Qué productos tienen stock bajo?"}] };
    }

    // Consulta de stock por producto
    if (q.includes("stock de ") || q.startsWith("stock ") || q.includes("cuanto queda de")) {
      let term = "";
      if (q.includes("stock de ")) term = q.split("stock de ")[1] || "";
      else if (q.startsWith("stock ")) term = q.replace(/^stock\s+/, "");
      else if (q.includes("cuanto queda de")) term = q.split("cuanto queda de")[1] || "";
      term = term.trim();
      const product = state.products.find(p => agentNormalize(p.name).includes(term) || agentNormalize(p.barcode||"") === term);
      if (product) {
        return { html:`<p><strong>${escapeHtml(product.name)}</strong> tiene <strong>${Number(product.stock||0)} unidades</strong> disponibles.</p>${product.stock < 5 ? `<p>⚠ Está por debajo del nivel de alerta de 5 unidades.</p>` : `<p>El stock está por encima del nivel de alerta.</p>`}`, actions:isAdmin() ? [{label:"Abrir Artículos",route:"products"}] : [] };
      }
    }

    if (!q.includes("prioriza") && (q.includes("stock bajo") || q.includes("poco stock") || q.includes("reponer") || q.includes("reposicion"))) {
      return { html:`<p>Detecté <strong>${lowStock.length} producto${lowStock.length===1?"":"s"}</strong> con menos de 5 unidades.</p>${agentProductRows(lowStock,p=>`${Number(p.stock||0)} unidades disponibles`)}`, actions:isAdmin() ? [{label:"Abrir Artículos",route:"products"},{label:"Priorizar reposición",prompt:"Priorizá la reposición de stock"}] : [] };
    }

    if (q.includes("sin stock") || q.includes("agotado")) {
      return { html:`<p>Hay <strong>${outStock.length}</strong> producto${outStock.length===1?"":"s"} sin stock.</p>${agentProductRows(outStock,p=>"0 unidades · requiere reposición")}`, actions:isAdmin() ? [{label:"Abrir Artículos",route:"products"}] : [] };
    }

    if (q.includes("prioriza") && (q.includes("reposicion") || q.includes("stock"))) {
      const last30 = agentLastDaysSales(30);
      const demand = {};
      last30.forEach(sale => (sale.items||[]).forEach(item => { demand[item.productId]=(demand[item.productId]||0)+Number(item.qty||0); }));
      const ranked = lowStock.map(p => ({...p,_demand:demand[p.id]||0,_score:(5-Number(p.stock||0))*10+(demand[p.id]||0)})).sort((a,b)=>b._score-a._score);
      return { html:`<p>Ordené la reposición combinando <strong>stock actual</strong> y <strong>demanda de los últimos 30 días</strong>.</p>${agentProductRows(ranked,p=>`${p.stock} en stock · ${p._demand} vendidas en 30 días`)}`, actions:isAdmin() ? [{label:"Abrir Artículos",route:"products"}] : [] };
    }

    if (q.includes("resumen") && (q.includes("hoy") || q.includes("dia"))) {
      const top = agentTopProduct(today,"units");
      return { html:`<p><strong>Resumen de hoy para ${escapeHtml(user?.name||"el usuario")}</strong></p><ul><li>${todayData.operations} operaciones.</li><li>Facturación: <strong>${money(todayData.revenue)}</strong>.</li><li>Ticket promedio: <strong>${money(todayData.avg)}</strong>.</li><li>${todayData.units} unidades vendidas.</li>${top?`<li>Producto más vendido: <strong>${escapeHtml(top.name)}</strong> (${top.units} unidades).</li>`:""}</ul>`, actions:[{label:"Ver cobros de hoy",prompt:"¿Cómo se cobraron las ventas de hoy?"},{label:"Preparar cierre",prompt:"Prepará el cierre del día"}] };
    }

    if ((q.includes("cuanto") || q.includes("total") || q.includes("factur")) && q.includes("hoy")) {
      return { html:`<p>Hoy ${isAdmin()?"el negocio":"vos"} lleva <strong>${money(todayData.revenue)}</strong> facturados en <strong>${todayData.operations}</strong> operaciones.</p><p>El ticket promedio es de <strong>${money(todayData.avg)}</strong>.</p>`, actions:[{label:"Resumen completo",prompt:"Dame un resumen de hoy"}] };
    }

    if (q.includes("ticket promedio") || (q.includes("promedio") && q.includes("venta"))) {
      return { html:`<p>El ticket promedio de hoy es <strong>${money(todayData.avg)}</strong>, calculado sobre ${todayData.operations} operaciones.</p><p>En el mes actual el promedio es <strong>${money(monthData.avg)}</strong>.</p>` };
    }

    if ((q.includes("mes") && (q.includes("venta") || q.includes("factur") || q.includes("llevo"))) || q.includes("este mes")) {
      return { html:`<p>En el mes actual llevás <strong>${money(monthData.revenue)}</strong> en ${monthData.operations} operaciones, con ${monthData.units} unidades vendidas.</p><p>Ticket promedio mensual: <strong>${money(monthData.avg)}</strong>.</p>` };
    }

    if ((q.includes("ayer") && q.includes("hoy")) || q.includes("comparar hoy") || q.includes("comparacion")) {
      const yd=agentSalesSummary(yesterday);
      const diff=todayData.revenue-yd.revenue;
      const pct=yd.revenue ? diff/yd.revenue*100 : (todayData.revenue?100:0);
      return { html:`<p>Hoy: <strong>${money(todayData.revenue)}</strong>. Ayer: <strong>${money(yd.revenue)}</strong>.</p><p>${diff>=0?"▲":"▼"} Diferencia: <strong>${money(Math.abs(diff))}</strong> (${Math.abs(pct).toFixed(1)}% ${diff>=0?"por encima":"por debajo"}).</p>` };
    }

    if (q.includes("producto") && (q.includes("mas vendido") || q.includes("vende mas") || q.includes("top"))) {
      const top=agentTopProduct(q.includes("hoy")?today:month,"units");
      return top ? { html:`<p>El producto con mayor cantidad vendida ${q.includes("hoy")?"hoy":"este mes"} es <strong>${escapeHtml(top.name)}</strong>.</p><p>Vendió ${top.units} unidades y generó ${money(top.revenue)}.</p>` } : { html:`<p>Todavía no hay ventas suficientes para calcular un producto líder.</p>` };
    }

    if (q.includes("factura mas") || q.includes("mayor facturacion") || q.includes("producto que mas factura")) {
      const top=agentTopProduct(month,"revenue");
      return top ? { html:`<p>Este mes, <strong>${escapeHtml(top.name)}</strong> es el producto con mayor facturación: <strong>${money(top.revenue)}</strong>.</p>` } : { html:`<p>No hay ventas del mes para hacer ese cálculo.</p>` };
    }

    if (q.includes("rentable") || q.includes("rentabilidad") || q.includes("ganancia por producto")) {
      const rows=buildProductStats(month).filter(r=>r.cost>0).sort((a,b)=>b.profit-a.profit).slice(0,5);
      if (!rows.length) return { html:`<p>No tengo suficientes costos cargados para calcular rentabilidad con precisión.</p>${isAdmin()?`<p>Actualmente hay ${noCost.length} productos sin costo informado.</p>`:""}`, actions:isAdmin()?[{label:"Abrir Artículos",route:"products"}]:[] };
      return { html:`<p>Los productos que más ganancia bruta generaron este mes son:</p><ul>${rows.map((r,i)=>`<li>${i+1}. <strong>${escapeHtml(r.name)}</strong>: ${money(r.profit)} de ganancia.</li>`).join("")}</ul>` };
    }

    if (q.includes("cobr") || q.includes("metodo de pago") || q.includes("forma de pago")) {
      const ranking=agentPaymentRanking(q.includes("mes")?month:today);
      if (!ranking.length) return { html:`<p>No hay operaciones para analizar los métodos de pago en ese período.</p>` };
      return { html:`<p>Distribución de cobros ${q.includes("mes")?"del mes":"de hoy"}:</p><ul>${ranking.map(([method,data])=>`<li><strong>${escapeHtml(method)}</strong>: ${money(data.total)} · ${data.count} operaciones.</li>`).join("")}</ul>` };
    }

    if (q.includes("mejor hora") || q.includes("hora vende") || q.includes("horario")) {
      const sales=agentLastDaysSales(30);
      const hours=Array.from({length:24},()=>({total:0,count:0}));
      sales.forEach(s=>{const h=new Date(s.createdAt).getHours();hours[h].total+=Number(s.total||0);hours[h].count+=1;});
      const best=hours.map((v,h)=>({...v,h})).sort((a,b)=>b.total-a.total)[0];
      return best?.total ? { html:`<p>En los últimos 30 días, la hora con mayor facturación fue alrededor de las <strong>${String(best.h).padStart(2,"0")}:00</strong>.</p><p>Acumuló ${money(best.total)} en ${best.count} operaciones.</p>` } : { html:`<p>No hay suficientes ventas recientes para detectar un horario fuerte.</p>` };
    }

    if (((q.includes("vendedor") || q.includes("usuario")) && (q.includes("mejor") || q.includes("vendio mas") || q.includes("ranking"))) || q.includes("quien vendio mas")) {
      if (!isAdmin()) return { html:`<p>Como vendedor puedo mostrarte tus propios resultados, pero el ranking general de usuarios queda reservado al administrador.</p>`, actions:[{label:"Mis ventas de hoy",prompt:"¿Cuánto vendí hoy?"}] };
      const map={};
      state.users.forEach(u=>map[u.id]={name:u.name,total:0,count:0});
      today.forEach(s=>{if(!map[s.sellerId])map[s.sellerId]={name:s.sellerName||"Usuario",total:0,count:0};map[s.sellerId].total+=Number(s.total||0);map[s.sellerId].count+=1;});
      const rank=Object.values(map).filter(x=>x.count).sort((a,b)=>b.total-a.total);
      return rank.length ? { html:`<p>Ranking de vendedores de hoy:</p><ul>${rank.map((r,i)=>`<li>${i+1}. <strong>${escapeHtml(r.name)}</strong>: ${money(r.total)} · ${r.count} ventas.</li>`).join("")}</ul>` } : { html:`<p>Todavía no hay ventas registradas hoy.</p>` };
    }

    if (q.includes("sin movimiento") || q.includes("no se venden") || q.includes("no vende")) {
      const recent=agentLastDaysSales(30);
      const moved=new Set(recent.flatMap(s=>s.items||[]).map(i=>i.productId));
      const stagnant=state.products.filter(p=>!moved.has(p.id));
      return { html:`<p>Hay <strong>${stagnant.length}</strong> productos sin ventas en los últimos 30 días.</p>${agentProductRows(stagnant,p=>`${p.stock||0} unidades en stock · sin movimiento reciente`)}`, actions:isAdmin()?[{label:"Abrir Artículos",route:"products"}]:[] };
    }

    if (q.includes("agotarse") || q.includes("cobertura") || q.includes("durara el stock")) {
      const recent=agentLastDaysSales(30);
      const sold={}; recent.forEach(s=>(s.items||[]).forEach(i=>sold[i.productId]=(sold[i.productId]||0)+Number(i.qty||0)));
      const risks=state.products.map(p=>{const daily=(sold[p.id]||0)/30;return {...p,_days:daily>0?Number(p.stock||0)/daily:Infinity,_sold:sold[p.id]||0};}).filter(p=>p._days!==Infinity && p._days<=14).sort((a,b)=>a._days-b._days);
      return { html:`<p>Según el ritmo de venta de los últimos 30 días, encontré <strong>${risks.length}</strong> productos con cobertura estimada de 14 días o menos.</p>${agentProductRows(risks,p=>`aprox. ${Math.max(0,p._days).toFixed(1)} días de cobertura · stock ${p.stock}`)}` };
    }

    if (q.includes("fiscal") || q.includes("arca") || q.includes("comprobante pendiente")) {
      if (!isAdmin()) return { html:`<p>La gestión fiscal completa corresponde al administrador. Si una venta queda pendiente, conviene avisarle para que revise la autorización.</p>` };
      return { html:`<p>Hay <strong>${pendingFiscal.length}</strong> comprobantes pendientes de autorización fiscal.</p>${pendingFiscal.length?`<p>Conviene revisarlos antes del cierre para evitar operaciones sin confirmar.</p>`:`<p>No hay pendientes fiscales en este momento.</p>`}`, actions:[{label:"Abrir ARCA",route:"fiscal"},{label:"Abrir Historial",route:"history"}] };
    }

    if (q.includes("objetivo") || q.includes("meta mensual")) {
      const goal=Number(state.settings?.analytics?.monthlySalesGoal||0);
      if (!goal) return { html:`<p>No hay un objetivo mensual configurado todavía.</p>${isAdmin()?`<p>Podés definirlo desde Estadísticas → Objetivos y costos.</p>`:""}`, actions:isAdmin()?[{label:"Abrir Estadísticas",route:"statistics"}]:[] };
      const pct=goal?monthData.revenue/goal*100:0;
      return { html:`<p>Objetivo mensual: <strong>${money(goal)}</strong>.</p><p>Llevás ${money(monthData.revenue)} (${pct.toFixed(1)}%). ${monthData.revenue>=goal?"✓ Objetivo alcanzado.":`Faltan <strong>${money(goal-monthData.revenue)}</strong>.`}</p>` };
    }

    if (q.includes("organiza") || q.includes("prioridades") || q.includes("que tengo que revisar") || q.includes("plan del turno")) {
      const tasks=[];
      if (lowStock.length) tasks.push(`Revisar reposición: ${lowStock.length} productos tienen menos de 5 unidades.`);
      if (outStock.length) tasks.push(`Prioridad alta: ${outStock.length} productos están agotados.`);
      if (isAdmin() && pendingFiscal.length) tasks.push(`Resolver ${pendingFiscal.length} comprobantes fiscales pendientes.`);
      if (isAdmin() && noCost.length) tasks.push(`Completar costos de ${noCost.length} productos para mejorar los cálculos de margen.`);
      tasks.push(`Controlar la terminal de ventas: hoy hay ${todayData.operations} operaciones por ${money(todayData.revenue)}.`);
      if (!tasks.length) tasks.push("No detecté tareas críticas. Podés concentrarte en ventas y atención al cliente.");
      return { html:`<p><strong>Prioridades sugeridas para el turno</strong></p><div class="agent-checklist">${tasks.map(t=>`<div class="agent-check"><span class="mark">✓</span><span>${escapeHtml(t)}</span></div>`).join("")}</div>`, actions:[{label:"Resumen de hoy",prompt:"Dame un resumen de hoy"},{label:"Revisar stock",prompt:"¿Qué productos tienen stock bajo?"}] };
    }

    if (q.includes("cierre") || q.includes("cerrar el dia") || q.includes("fin del dia")) {
      const payments=agentPaymentRanking(today);
      const top=agentTopProduct(today,"units");
      const tasks=[
        `Confirmar ${todayData.operations} operaciones por ${money(todayData.revenue)}.`,
        payments.length ? `Revisar cobros: ${payments.map(([m,d])=>`${m} ${money(d.total)}`).join(" · ")}.` : "No hubo cobros registrados hoy.",
        top ? `Producto líder del día: ${top.name}, ${top.units} unidades.` : "No hubo productos vendidos hoy.",
        lowStock.length ? `Dejar anotada reposición para ${lowStock.length} productos con stock bajo.` : "No hay alertas de stock bajo.",
        isAdmin() ? `${pendingFiscal.length} comprobantes fiscales pendientes.` : "Avisar al administrador si algún comprobante quedó pendiente."
      ];
      return { html:`<p><strong>Cierre operativo sugerido</strong></p><div class="agent-checklist">${tasks.map(t=>`<div class="agent-check"><span class="mark">•</span><span>${escapeHtml(t)}</span></div>`).join("")}</div>`, actions:[{label:"Abrir Historial",route:"history"},{label:"Cobros de hoy",prompt:"¿Cómo se cobraron las ventas de hoy?"}] };
    }

    return { html:`<p>No tengo una respuesta preconfigurada para esa frase, pero puedo ayudarte con <strong>ventas, stock, cobros, productos, horarios, objetivos y organización del turno</strong>.</p><p>Probá, por ejemplo: “¿Cuánto vendí hoy?”, “¿Qué tengo que reponer?” o “Prepará el cierre del día”.</p>` };
  }

  function agentAddMessage(role, content, actions = []) {
    agentMessages.push({ role, content, actions });
    if (agentMessages.length > 40) agentMessages = agentMessages.slice(-40);
  }

  function agentRenderMessages() {
    const log=document.getElementById("agentChatLog");
    if (!log) return;
    if (!agentMessages.length) {
      log.innerHTML=`<div class="agent-empty-chat"><div class="big-ai">AI</div><strong>¿Qué necesitás revisar?</strong><span>El agente trabaja 100% local con comandos preconfigurados y calcula respuestas usando los datos guardados en GestOK.</span></div>`;
      return;
    }
    log.innerHTML=agentMessages.map((message,msgIndex)=>`
      <div class="agent-message ${message.role}">
        <div class="mini-avatar">${message.role==="user"?"YO":"AI"}</div>
        <div class="agent-bubble">${message.content}${agentActionsHtml(message.actions||[])}</div>
      </div>`).join("");
    log.querySelectorAll("[data-agent-action-index]").forEach(button=>{
      const bubble=button.closest(".agent-message");
      const messages=[...log.querySelectorAll(".agent-message")];
      const msgIndex=messages.indexOf(bubble);
      const action=agentMessages[msgIndex]?.actions?.[Number(button.dataset.agentActionIndex)];
      if (!action) return;
      button.addEventListener("click",()=>agentExecuteAction(action));
    });
    requestAnimationFrame(()=>{ log.scrollTop=log.scrollHeight; });
  }

  function agentExecuteAction(action) {
    if (action.route) {
      const adminOnly=["products","statistics","fiscal"];
      if (adminOnly.includes(action.route) && !isAdmin()) return toast("Esta sección requiere permisos de administrador.","error");
      route=action.route;
      renderAppShell();
      return;
    }
    if (action.prompt) agentAsk(action.prompt);
  }

  function agentAsk(question) {
    const text=String(question||"").trim();
    if (!text) return;
    agentAddMessage("user",`<p>${escapeHtml(text)}</p>`);
    agentRenderMessages();
    const response=agentResponseFor(text);
    window.setTimeout(()=>{
      agentAddMessage("assistant",response.html,response.actions||[]);
      agentRenderMessages();
    },180);
  }

    if (agentSessionUserId !== user?.id) {
      agentSessionUserId=user?.id||null;
      agentMessages=[];
      const roleText=isAdmin()?"Puedo analizar todo el negocio y ejecutar accesos rápidos.":"Voy a trabajar solo con tus ventas y con información operativa permitida para vendedores.";

    }

      ? ["Dame un resumen de hoy","¿Qué productos tienen stock bajo?","¿Quién vendió más hoy?","¿Cómo se cobraron las ventas de hoy?","Priorizá la reposición de stock"]
      : ["¿Cuánto vendí hoy?","Dame un resumen de hoy","¿Qué productos tienen stock bajo?","¿Cómo se cobraron las ventas de hoy?","Organizá mi turno"];
    page.innerHTML=`

          <div class="agent-header">
            <div class="agent-identity"><div class="agent-avatar">AI</div><div><h2>Agente GestOK</h2><p>Consultas, cálculos y organización operativa</p></div></div>

        </section>
        <aside class="agent-side">
          <section class="panel agent-intro-card"><h3>Asistente local inteligente</h3><p>No requiere API ni conexión. Reconoce consultas predefinidas, realiza cálculos con ventas e inventario y ejecuta accesos rápidos dentro del sistema.</p></section>
          <section class="panel agent-command-panel">
            <h3>Acciones rápidas</h3>

              <button type="button" class="agent-command-btn" data-agent-route="sales"><span>🛒</span>Registrar una venta</button>

              <button type="button" class="agent-command-btn" data-agent-prompt="Dame un resumen de hoy"><span>$</span>Resumen de ventas</button>
              <button type="button" class="agent-command-btn" data-agent-prompt="¿Qué productos tienen stock bajo?"><span>!</span>Stock crítico</button>
              <button type="button" class="agent-command-btn" data-agent-prompt="¿Cómo se cobraron las ventas de hoy?"><span>¤</span>Analizar cobros</button>
              <button type="button" class="agent-command-btn" data-agent-prompt="¿Cuál es la mejor hora para vender?"><span>🕒</span>Horario más fuerte</button>
              <button type="button" class="agent-command-btn" data-agent-prompt="¿Qué productos no se venden?"><span>−</span>Productos sin movimiento</button>
            </div></div>
            <div class="agent-command-group"><span class="agent-command-label">Navegación</span><div class="agent-command-list">
              <button type="button" class="agent-command-btn" data-agent-route="history"><span>📜</span>Abrir historial</button>
              ${isAdmin()?`<button type="button" class="agent-command-btn" data-agent-route="statistics"><span>📊</span>Abrir estadísticas</button><button type="button" class="agent-command-btn" data-agent-route="products"><span>📦</span>Abrir artículos</button>`:""}
            </div></div>

    const input=document.getElementById("agentInput");
    const send=()=>{ const value=input.value; input.value=""; agentAsk(value); input.focus(); };
    document.getElementById("agentSend").addEventListener("click",send);
    input.addEventListener("keydown",event=>{ if(event.key==="Enter") send(); });
    document.getElementById("clearAgentChat").addEventListener("click",()=>{agentMessages=[];agentAddMessage("assistant",`<p>Conversación limpia. ¿Qué necesitás revisar ahora?</p>`);agentRenderMessages();});
  }

  function metric(label, value, detail, negative = false) {
    return `<div class="metric"><span>${label}</span><strong>${value}</strong><div class="trend ${negative ? "down" : ""}">${detail}</div></div>`;
  }

  function defaultTerminalSession(userId) {
    return {
      userId,
      cart: [],
      voucherType: "Factura C",
      paymentMethod: "Efectivo",
      customerName: "",
      customerDocType: "99",
      customerDocNumber: "",
      customerTaxStatus: "consumidor_final"
    };
  }

  function getSessionUserId(sessionKey) {
    return sessionKey === "secondary" ? salesSplitSecondaryUserId : currentUser()?.id;
  }

  function getTerminalSession(sessionKey) {
    const userId = getSessionUserId(sessionKey);
    if (!userId) return null;
    if (!terminalSessions[sessionKey] || terminalSessions[sessionKey].userId !== userId) {
      terminalSessions[sessionKey] = defaultTerminalSession(userId);
    }
    return terminalSessions[sessionKey];
  }

  function resetTerminalSession(sessionKey) {
    const userId = getSessionUserId(sessionKey);
    if (!userId) return;
    terminalSessions[sessionKey] = defaultTerminalSession(userId);
  }

  function salesInputId(sessionKey, base) {
    return `${base}-${sessionKey}`;
  }

  function currentSplitUser() {
    return state.users.find(user => user.id === salesSplitSecondaryUserId) || null;
  }

  function bindSalesTerminal(sessionKey) {
    const session = getTerminalSession(sessionKey);
    if (!session) return;
    const barcodeInput = document.getElementById(salesInputId(sessionKey, 'barcodeScanner'));
    barcodeInput?.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        const code = barcodeInput.value.trim();
        if (!code) return;
        const product = getProductByBarcodeFast(code);
        if (product) {
          addToCart(product.id, sessionKey);
          barcodeInput.value = '';
          return;
        }
        const scaleResult = parseScaleBarcode(code);
        if (scaleResult?.error) {
          barcodeInput.value = '';
          return toast(scaleResult.error, 'error');
        }
        if (scaleResult?.product) {
          addWeightedToCart(scaleResult.product.id, scaleResult.weightKg, sessionKey, { code: scaleResult.code, encodedTotal: scaleResult.encodedTotal });
          barcodeInput.value = '';
          return;
        }
        toast('No existe un artículo con ese código.', 'error');
        barcodeInput.value = '';
      }
    });
    document.getElementById(salesInputId(sessionKey, 'openProductPicker'))?.addEventListener('click', () => openSalesProductPicker(sessionKey));
    document.getElementById(salesInputId(sessionKey, 'clearCart'))?.addEventListener('click', () => {
      session.cart = [];
      updateCartUI(sessionKey);
    });
    document.getElementById(salesInputId(sessionKey, 'completeSale'))?.addEventListener('click', () => completeSale(sessionKey));
    [
      ['voucherType', 'voucherType'],
      ['paymentMethod', 'paymentMethod'],
      ['customerName', 'customerName'],
      ['customerDocType', 'customerDocType'],
      ['customerDocNumber', 'customerDocNumber'],
      ['customerTaxStatus', 'customerTaxStatus']
    ].forEach(([prop, base]) => {
      const input = document.getElementById(salesInputId(sessionKey, base));
      if (input) {
        input.addEventListener('input', () => { session[prop] = input.value; });
        input.addEventListener('change', () => { session[prop] = input.value; });
      }
    });
  }

  function productTile(product) {
    const fallback = `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#e2e8f0"/><text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" fill="#334155" font-family="Arial" font-size="34">Sin imagen</text></svg>`)}`;
    return `<div class="sales-picker-item">
      <img src="${product.image || fallback}" alt="${escapeHtml(product.name)}" />
      <strong>${escapeHtml(product.name)}</strong>
      <small>${money(product.price)}${product.saleType === 'weight' ? ' / kg' : ''} · Stock ${product.saleType === 'weight' ? formatWeightKg(product.stock) : product.stock}</small>
      <small>${product.saleType === 'weight' ? `⚖ PLU: ${escapeHtml(product.plu || 'sin asignar')}` : (product.barcode ? `Código: ${escapeHtml(product.barcode)}` : 'Sin código asignado')}</small>
      <div class="sales-picker-actions">
        <button type="button" class="btn small add-picker-product" data-id="${product.id}">Agregar</button>
      </div>
    </div>`;
  }

  function openSalesProductPicker(sessionKey = 'primary') {
    const availableProducts = state.products;
    const modal = document.createElement('div');
    modal.className = 'modal-backdrop';
    modal.innerHTML = `
      <div class="modal" style="width:min(100%,900px)">
        <div class="modal-header"><h2>Agregar producto a ${escapeHtml((state.users.find(user => user.id === getSessionUserId(sessionKey)) || currentUser()).name)}</h2><button type="button" class="icon-btn" id="closeSalesPicker">×</button></div>
        <div class="field" style="margin-bottom:14px"><input id="salesPickerSearch" placeholder="Buscar por nombre o código..." /></div>
        <div id="salesPickerContent"></div>
      </div>`;
    document.body.appendChild(modal);

    const renderPicker = items => {
      document.getElementById('salesPickerContent').innerHTML = items.length
        ? `<div class="sales-picker-grid">${items.map(productTile).join('')}</div>`
        : `<div class="empty">No se encontraron artículos disponibles.</div>`;
      modal.querySelectorAll('.add-picker-product[data-id]').forEach(button => {
        button.addEventListener('click', () => {
          addToCart(button.dataset.id, sessionKey);
          modal.remove();
        });
      });
    };

    renderPicker(availableProducts.filter(product=>product.stock>0).slice(0, PERF_PAGE_SIZE));
    const close = () => modal.remove();
    document.getElementById('closeSalesPicker').addEventListener('click', close);
    modal.addEventListener('click', event => { if (event.target === modal) close(); });
    document.getElementById('salesPickerSearch').addEventListener('input', event => {
      const term = event.target.value.trim().toLowerCase();
      renderPicker(availableProducts.filter(product => product.stock>0 && (product.name.toLowerCase().includes(term) || String(product.barcode || '').toLowerCase().includes(term))).slice(0, PERF_PAGE_SIZE));
    });
  }
